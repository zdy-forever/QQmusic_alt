<title>月下方海</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
  /* Layout: full-bleed WebGL night scene; quiet caption bottom-left, one control bottom-right */
  :root {
    --night: #131a2b;   /* horizon haze = fog colour, so sea and sky meet seamlessly */
    --deep: #03050c;
    --ink: #d6deee;
    --dim: #7d8aa6;
    --line: rgba(214, 222, 238, 0.26);
    --display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --moon-rgb: 214, 226, 248;     /* the scene's light colour, kept in step with the moon by the page */
    --ui: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;   /* all buttons */
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    touch-action: none;            /* drags steer the scene, not the browser */
    user-select: none;
    -webkit-user-select: none;
    background: var(--night);
    color: var(--ink);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  /* Opening: the night fades up from black */
  #veil { position: fixed; inset: 0; z-index: 30; background: var(--deep); pointer-events: none; transition: opacity 1.8s ease-out; display: grid; place-items: center; }
  #veil.gone { opacity: 0; }
  /* After the closing: a faint line in the dark */
  #veil .veil-hint { margin: 0; font-family: var(--ui); font-size: 13px; letter-spacing: 0.2em; color: var(--dim); opacity: 0; transition: opacity 2s ease; }
  #veil.ended .veil-hint { opacity: 0.7; }
  /* The buttons step aside while the closing plays */
  body.closing .topbar, body.closing .controls, body.closing .player { opacity: 0; pointer-events: none; transition: opacity .6s; }


  /* The caption is no longer shown on screen; it stays in the page (visually hidden) so screen readers
     still hear the title, the locked cube, the song and the sky */
  .cap {
    position: fixed;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    pointer-events: none;
  }
  .cap h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(22px, 3vw, 32px);
    letter-spacing: 0.32em;
    color: var(--ink);
    text-wrap: balance;
  }
  .cap p {
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    line-height: 1.7;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .hint { display: none; }
  @media (hover: hover) and (pointer: fine) { .hint { display: inline; } .hint-touch { display: none; } }

  .controls {
    position: fixed;
    right: calc(max(16px, env(safe-area-inset-right, 0px)) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  .cap p.coord { color: var(--ink); letter-spacing: 0.12em; }
  .cap p.song { font-family: var(--display), var(--mono); font-size: 13px; letter-spacing: 0.1em; }
  .topbar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    right: calc(max(16px, env(safe-area-inset-right, 0px)) + 8px);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  /* The controls step back when you are just watching, and come forward as soon as you move */
  .topbar, .controls { transition: opacity .9s ease; }
  body.idle .topbar:not(:focus-within), body.idle .controls:not(:focus-within) { opacity: 0.28; }
  .panel {
    width: min(300px, calc(100vw - 56px));
    padding: 18px 18px 14px;
    border: 0;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(14, 20, 36, 0.78), rgba(6, 9, 18, 0.86));
    box-shadow: inset 0 1px 0 rgba(var(--moon-rgb), 0.28), 0 18px 40px -12px rgba(0, 0, 0, 0.6);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    display: grid;
    gap: 10px;
    user-select: text;
    -webkit-user-select: text;
  }
  .panel h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 300;
    font-size: 16px;
    letter-spacing: 0.2em;
    color: var(--ink);
  }
  .panel p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--dim); }
  .panel .status { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink); }
  .panel #importClose { justify-self: end; margin-top: 2px; }
  .imp-body { display: grid; gap: 8px; max-height: min(52vh, 420px); overflow-y: auto; overscroll-behavior: contain; }
  .imp-body p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--dim); }
  .imp-body code {
    font-family: var(--mono); font-size: 12px; color: var(--ink);
    background: rgba(214, 222, 238, 0.08); padding: 1px 6px; border-radius: 4px; user-select: all;
  }
  .imp-body ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-size: 13px; line-height: 1.6; color: var(--dim); }
  .imp-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .imp-item, .imp-btn {
    font: inherit; font-family: var(--ui); font-size: 13px; color: var(--ink); text-align: left; cursor: pointer;
    background: rgba(214, 222, 238, 0.06); border: 0; border-radius: 8px;
    padding: 8px 12px; transition: background-color .2s, color .2s, box-shadow .2s;
  }
  .imp-btn { font-size: 12px; letter-spacing: 0.04em; padding: 7px 12px; }
  .imp-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: baseline; background: transparent; border-radius: 6px; }
  .imp-item + .imp-item { box-shadow: inset 0 1px 0 rgba(214, 222, 238, 0.07); }
  .imp-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imp-item span:last-child { font-family: var(--ui); font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .imp-item:hover, .imp-btn:hover { background: rgba(var(--moon-rgb), 0.14); color: #fff; }
  .imp-item:focus-visible, .imp-btn:focus-visible { outline: 1px solid rgba(var(--moon-rgb), 0.9); outline-offset: 2px; }
  .imp-item[disabled], .imp-btn[disabled] { opacity: 0.45; cursor: default; }
  .imp-small { font-size: 12px !important; }
  .imp-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); cursor: pointer; }
  .imp-check input { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
  /* Shown while files are dragged over the page */
  .drop-hint {
    position: fixed;
    inset: 12px;
    border: 1.5px dashed var(--ink);
    border-radius: 18px;
    background: rgba(10, 14, 26, 0.45);
    display: grid;
    place-items: center;
    pointer-events: none;
    z-index: 20;
  }
  .drop-hint p { margin: 0; font-family: var(--display); font-size: 22px; letter-spacing: 0.2em; color: var(--ink); }
  .imp-current { border-left: 1px solid rgba(var(--moon-rgb), 0.7); padding-left: 10px; }
  .imp-body a { color: var(--ink); }
  /* Buttons as moonlit words: no frame, a soft halo so they read over bright sky, a line of light under the
     word on hover, and a small moon before the word while a mode is on. They take the scene's light colour. */
  .top-row { display: flex; gap: 18px; align-items: center; }
  /* Immersive view (where real fullscreen is not allowed): only the white point stays */
  body.immersive .controls { opacity: 0 !important; pointer-events: none; }
  .fs-note {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 22px); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 46px);
    max-width: min(360px, calc(100% - 80px)); margin: 0; text-align: right;
    font-family: var(--ui); font-size: 12px; line-height: 1.6; letter-spacing: 0.04em; color: rgba(var(--moon-rgb), 0.85);
    text-shadow: 0 0 10px rgba(3, 5, 12, 0.95); pointer-events: none;
    opacity: 0; transition: opacity .5s ease;
  }
  .fs-note.show { opacity: 1; }
  /* The white point beside 歌单导入: tap it and a line of light runs down, carrying the extra controls */
  .more { position: relative; display: flex; align-items: center; margin-left: -6px; }
  #moreDot { width: 28px; height: 34px; padding: 0; border: 0; background: transparent; cursor: pointer; display: grid; place-items: center; border-radius: 50%; }
  #moreDot span {
    width: 7px; height: 7px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 6px 1px rgba(var(--moon-rgb), 0.85), 0 0 16px 2px rgba(var(--moon-rgb), 0.45);
    animation: moreBreath 3.6s ease-in-out infinite;
    transition: transform .3s ease;
  }
  #moreDot:hover span, #moreDot[aria-expanded="true"] span { transform: scale(1.35); }
  #moreDot:focus-visible { outline: 1px solid rgba(var(--moon-rgb), 0.8); outline-offset: 0; }
  @keyframes moreBreath { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
  .more-menu { position: absolute; top: 100%; right: 0; width: 28px; height: 0; pointer-events: none; }
  .more-line {
    position: absolute; top: -6px; right: 13.5px; width: 1px; height: var(--len, 80px);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(var(--moon-rgb), 0.55) 70%, rgba(var(--moon-rgb), 0));
    box-shadow: 0 0 6px rgba(var(--moon-rgb), 0.7);
    transform-origin: top; transform: scaleY(0);
    transition: transform .45s cubic-bezier(.2, .7, .2, 1) .05s;
  }
  .more.open .more-line { transform: scaleY(1); transition-delay: 0s; }
  #moreMenu > button {
    position: absolute; right: 26px; white-space: nowrap;
    opacity: 0; transform: translateX(8px); pointer-events: none;
    transition: opacity .25s ease, transform .25s ease, color .25s, text-shadow .25s;
  }
  #more.open #moreMenu > button { opacity: 1; transform: none; pointer-events: auto; }
  /* a short tick from each control to the line */
  #moreMenu > button::before {
    content: ""; position: absolute; top: 50%; right: -12.5px; width: 9px; height: 1px;
    background: rgba(var(--moon-rgb), 0.75); box-shadow: 0 0 4px rgba(var(--moon-rgb), 0.6);
  }
  @media (prefers-reduced-motion: reduce) {
    #moreDot span { animation: none; }
    .more-line, #moreMenu > button { transition: opacity .2s; }
  }
  #toggle, #unlock, #seaview, #importBtn, #importClose, #replayBtn, #outroBtn, #fsBtn {
    position: relative;
    font-family: var(--ui);
    font-size: 13px;
    letter-spacing: 0.14em;
    color: rgba(var(--moon-rgb), 0.72);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 8px 4px 9px;
    cursor: pointer;
    text-shadow: 0 0 10px rgba(3, 5, 12, 0.9), 0 0 2px rgba(3, 5, 12, 0.8);
    transition: color .25s, text-shadow .25s;
  }
  #toggle::after, #unlock::after, #seaview::after, #importBtn::after, #importClose::after, #replayBtn::after, #outroBtn::after, #fsBtn::after {
    content: "";
    position: absolute;
    left: 4px;
    right: calc(4px + 0.14em);              /* the letter-spacing trails the last character */
    bottom: 3px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgb(var(--moon-rgb)) 25%, rgb(var(--moon-rgb)) 75%, transparent);
    box-shadow: 0 0 6px rgba(var(--moon-rgb), 0.9);
    transform: scaleX(0);
    opacity: 0;
    transition: transform .35s ease, opacity .35s ease;
  }
  #toggle:hover, #unlock:hover, #seaview:hover, #importBtn:hover, #importClose:hover, #replayBtn:hover, #outroBtn:hover, #fsBtn:hover,
  #importBtn[aria-expanded="true"], #seaview[aria-pressed="true"] {
    color: #fff;
    text-shadow: 0 0 10px rgba(3, 5, 12, 0.9), 0 0 14px rgba(var(--moon-rgb), 0.55);
  }
  #toggle:hover::after, #unlock:hover::after, #seaview:hover::after, #importBtn:hover::after, #importClose:hover::after,
  #replayBtn:hover::after, #outroBtn:hover::after, #fsBtn:hover::after, #importBtn[aria-expanded="true"]::after {
    transform: scaleX(1);
    opacity: 1;
  }
  #toggle:active, #unlock:active, #seaview:active, #importBtn:active, #importClose:active, #replayBtn:active, #outroBtn:active, #fsBtn:active { color: rgba(var(--moon-rgb), 0.9); }
  #toggle:focus-visible, #unlock:focus-visible, #seaview:focus-visible, #importBtn:focus-visible, #importClose:focus-visible,
  #replayBtn:focus-visible, #outroBtn:focus-visible, #fsBtn:focus-visible { outline: 1px solid rgba(var(--moon-rgb), 0.8); outline-offset: 2px; }
  /* A mode that is on wears a small moon before its name */
  #seaview[aria-pressed="true"]::before {
    content: "";
    position: absolute;
    left: -10px;
    top: 50%;
    width: 5px;
    height: 5px;
    margin-top: -3px;
    border-radius: 50%;
    background: rgb(var(--moon-rgb));
    box-shadow: 0 0 8px rgb(var(--moon-rgb));
  }
  @media (hover: none) {
    #toggle, #unlock, #seaview, #importBtn, #importClose, #replayBtn, #outroBtn, #fsBtn { color: rgba(var(--moon-rgb), 0.88); }
  }
  @media (prefers-reduced-motion: reduce) {
    .topbar, .controls { transition: none; }
    #toggle::after, #unlock::after, #seaview::after, #importBtn::after, #importClose::after, #replayBtn::after, #outroBtn::after, #fsBtn::after { transition: none; }
  }

  /* Sea-view player, gathered around the moon: the moon is play/pause, previous and next sit either side of
     it, the progress line runs just under it. The page moves the whole group to the moon's screen position. */
  .player {
    --accent: var(--ink);
    --mr: 40px;                       /* the moon's on-screen radius, set by the page */
    position: fixed;
    left: 0;
    top: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s, visibility 0s linear .5s;
  }
  .player.on { opacity: 1; visibility: visible; transition: opacity .5s; }
  .player.on > * { pointer-events: auto; }
  .pl-icon {
    position: absolute;
    top: -19px;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid transparent;
    border-radius: 50%;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    filter: drop-shadow(0 0 6px rgba(214, 222, 238, 0.45));
    transition: background-color .15s, border-color .15s, transform .15s;
  }
  .pl-prev { left: calc(-1 * var(--mr) - 62px); }
  .pl-next { left: calc(var(--mr) + 24px); }
  .pl-icon:hover { background: rgba(214, 222, 238, 0.1); border-color: var(--line); }
  .pl-icon:active { transform: scale(0.94); }
  .pl-icon:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .pl-bar {
    position: absolute;
    left: -140px;
    top: calc(var(--mr) + 16px);
    width: 280px;
    display: grid;
    grid-template-columns: 2.8em minmax(0, 1fr) 2.8em;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 6px rgba(3, 5, 12, 0.9);
  }
  .pl-bar span:first-child { text-align: right; }
  .pl-track { position: relative; height: 18px; cursor: pointer; touch-action: none; }
  .pl-track::before, .pl-fill {
    content: "";
    position: absolute;
    left: 0;
    top: 50%;
    height: 2px;
    margin-top: -1px;
    border-radius: 2px;
  }
  .pl-track::before { right: 0; background: var(--line); }
  .pl-fill { width: 0; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .pl-knob {
    position: absolute;
    top: 50%;
    left: 0;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    transform: scale(0.7);
    transition: transform .15s;
  }
  .pl-track:hover .pl-knob, .pl-track.drag .pl-knob { transform: scale(1.25); }
  .pl-track:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; border-radius: 4px; }
  .pl-track.idle { cursor: default; opacity: 0.45; }
  @media (prefers-reduced-motion: reduce) {
    .player, .player.on { transition: none; }
  }

  @media (max-width: 520px) {
    .cap { max-width: calc(100% - 130px); }
    .cap h1 { letter-spacing: 0.22em; }
  }
</style>

<div id="stage" aria-hidden="true"></div>
<div id="veil" aria-live="polite"><p class="veil-hint">点击任意处，重新开始</p></div>

<div class="cap">
  <h1>月下方海</h1>
  <p id="meta">正在铺设立方体…</p>
  <p id="skyNote">天象 · 晴夜</p>
  <p id="coord" class="coord" aria-live="polite" hidden></p>
  <p id="song" class="coord song" aria-live="polite" hidden></p>
</div>
<div class="topbar">
  <div class="top-row">
    <button id="replayBtn" type="button" hidden>重播开场</button>
    <div class="more" id="more">
      <button id="moreDot" type="button" aria-expanded="false" aria-controls="moreMenu" aria-label="更多功能"><span></span></button>
      <div class="more-menu" id="moreMenu" role="group" aria-label="更多功能">
        <i class="more-line" aria-hidden="true"></i>
        <button id="importBtn" type="button" aria-expanded="false" aria-controls="importPanel" tabindex="-1">歌单导入</button>
        <button id="fsBtn" type="button" aria-pressed="false" title="全屏（F）" tabindex="-1">全屏</button>
        <button id="outroBtn" type="button" tabindex="-1">退场</button>
      </div>
    </div>
  </div>
  <section id="importPanel" class="panel" role="dialog" aria-labelledby="importTitle" hidden>
    <h2 id="importTitle">歌单导入</h2>
    <p class="status" id="importStatus">把电脑里的音乐放到海面上</p>
    <div class="imp-body" id="importBody"></div>
    <button id="importClose" type="button">关闭</button>
  </section>
</div>
<div class="player" id="player" aria-hidden="true">
  <button id="plPrev" class="pl-icon pl-prev" type="button" aria-label="上一首" tabindex="-1">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="2" y="2.5" width="2" height="11" rx="0.6" fill="currentColor"/><path d="M14 2.8v10.4a.6.6 0 0 1-.92.5L5.4 8.5a.6.6 0 0 1 0-1l7.68-5.2a.6.6 0 0 1 .92.5z" fill="currentColor"/></svg>
  </button>
  <button id="plNext" class="pl-icon pl-next" type="button" aria-label="下一首" tabindex="-1">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="12" y="2.5" width="2" height="11" rx="0.6" fill="currentColor"/><path d="M2 2.8v10.4a.6.6 0 0 0 .92.5l7.68-5.2a.6.6 0 0 0 0-1L2.92 2.3a.6.6 0 0 0-.92.5z" fill="currentColor"/></svg>
  </button>
  <div class="pl-bar">
    <span id="plCur">0:00</span>
    <div class="pl-track" id="plTrack" role="slider" tabindex="-1" aria-label="播放进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="pl-fill" id="plFill"></div>
      <div class="pl-knob" id="plKnob"></div>
    </div>
    <span id="plDur">0:00</span>
  </div>
</div>
<p class="fs-note" id="fsNote" role="status" aria-live="polite"></p>
<div class="controls">
  <button id="unlock" type="button" hidden>返回海面 · Esc</button>
  <button id="seaview" type="button" aria-pressed="false" hidden>观海模式</button>
  <button id="toggle" type="button" aria-pressed="false">暂停</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const stage = document.getElementById('stage');
  const meta = document.getElementById('meta');
  const toggle = document.getElementById('toggle');

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = Math.min(innerWidth, innerHeight) < 700 || matchMedia('(pointer: coarse)').matches;

  // ---- Sea grid ----
  const COLS = small ? 130 : 200;
  const ROWS = small ? 112 : 150;
  const GAP = 1.0;
  const SIZE = 0.8;
  const COUNT = COLS * ROWS;

  // Moon sits low over the far edge so its path runs straight at the viewer
  const MOON_ELEV = 12.4;
  const e = MOON_ELEV * Math.PI / 180;
  const moonDir = new THREE.Vector3(0, Math.sin(e), -Math.cos(e)).normalize();

  // Swell components: [direction in degrees from +z, wavelength, amplitude]
  // Calm night swell: longer, lower and slower than open-sea waves
  const WAVES = [
    [  8, 30.0, 0.48],
    [-28, 16.0, 0.22],
    [ 40, 10.0, 0.11],
    [-60,  6.4, 0.055],
    [ 15,  3.8, 0.028]
  ];
  const SWELL_SPEED = 0.34;

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  } catch (err) {
    meta.textContent = '此设备无法启用 WebGL，动效无法显示。';
    toggle.hidden = true;
    return;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, small ? 1.75 : 2));
  renderer.setClearColor(0x131a2b, 1);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x131a2b, 0.0115);

  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1200);
  const camBase = new THREE.Vector3(0, 6.5, 22);
  camera.position.copy(camBase);

  // ---- Lights ----
  const moonLight = new THREE.DirectionalLight(0xb9c7ee, 0.95);
  moonLight.position.copy(moonDir).multiplyScalar(100);
  scene.add(moonLight);
  const hemi = new THREE.HemisphereLight(0x2c3d6a, 0x05070f, 0.75);
  scene.add(hemi);
  const fill = new THREE.DirectionalLight(0x22305a, 0.35);
  fill.position.set(0, 4, 30);
  scene.add(fill);

  // ---- Shared uniforms ----
  const U = {
    uTime: { value: 0 },
    uMoonDir: { value: moonDir.clone() },
    uPR: { value: renderer.getPixelRatio() },
    uSpot: { value: 0 },
    uAurora: { value: 0 },          // sky phenomena, eased 0..1
    uCloud: { value: 0 },
    // Scene tone (eased toward the playing song's palette)
    uHorizon: { value: new THREE.Color(0.075, 0.102, 0.169) },
    uZenith: { value: new THREE.Color(0.010, 0.016, 0.040) },
    uLightCol: { value: new THREE.Color(0.80, 0.87, 1.0) },
    // Music: ripple ring buffer in audio time, focus cube, countdown glow, loudness
    uAudioT: { value: 0 },
    // each ripple: x = start (audio time), y = strength, zw = origin on the sea
    uRip: { value: Array.from({ length: 12 }, () => new THREE.Vector4(-100, 0, 9999, 9999)) },
    uRipOn: { value: 0 },
    uFocusPos: { value: new THREE.Vector2(9999, 9999) },
    uGlow: { value: 0 },
    uLevel: { value: 0 },
    // Moon as a play/pause control in sea view
    uMoonHover: { value: 0 },
    uMoonPhase: { value: 0 },     // 0 full moon (music on) → 1 thin crescent (music paused)
    uMoonPulse: { value: 99 },    // seconds since the last tap on the moon
    uMoonGlyph: { value: 0 },     // 0 shows a pause mark on hover, 1 a play mark
    // Lyric face: which cube is steered, its held yaw/tilt and how strongly (0..1)
    uHoldPos: { value: new THREE.Vector2(9999, 9999) },
    uHoldYaw: { value: 0 },
    uHoldTilt: { value: 0 },
    uHoldW: { value: 0 },
    uEdgeOn: { value: 1 },         // hover edge glow: on in the main view, off once a cube is locked
    uGreyOn: { value: 0 },         // library view: song cubes in cover colours, the rest greyed (only while nothing plays)
    uIntro: { value: 1 },          // opening: 0 = sea folded into its middle, 1 = fully laid out
    uIntroC: { value: new THREE.Vector2(0, -20) },   // where the sea unfolds from: the middle of the opening view
    uCat: { value: 0 },            // easter egg: 0 = sea, 1 = every cube gathered into the cat
    uOutro: { value: 0 },          // closing: 0 = sea, 1 = every cube gathered into the centre cube
    uOutroCore: { value: 0 },      // closing: the centre cube going out
    uFocusEdge: { value: 0 }       // edge glow on the locked cube itself, faded out after the click
  };

  // ---- Sky dome with moon disc and halo ----
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: {
      uMoonDir: U.uMoonDir, uHorizon: U.uHorizon, uZenith: U.uZenith, uHalo: U.uLightCol,
      uMoonHover: U.uMoonHover, uMoonPhase: U.uMoonPhase, uMoonPulse: U.uMoonPulse, uMoonGlyph: U.uMoonGlyph,
      uTime: U.uTime, uAurora: U.uAurora, uCloud: U.uCloud
    },
    vertexShader: `
      varying vec3 vDir;
      void main(){
        vDir = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uMoonDir;
      uniform vec3 uHorizon;
      uniform vec3 uZenith;
      uniform vec3 uHalo;
      uniform float uMoonHover;
      uniform float uMoonPhase;
      uniform float uMoonPulse;
      uniform float uMoonGlyph;
      uniform float uTime;
      uniform float uAurora;
      uniform float uCloud;
      varying vec3 vDir;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float n2(vec2 p){
        vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
        float a = hash(i), b = hash(i+vec2(1.0,0.0)), c = hash(i+vec2(0.0,1.0)), d = hash(i+vec2(1.0,1.0));
        return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
      }
      void main(){
        vec3 dir = normalize(vDir);
        vec3 horizon = uHorizon;
        vec3 zenith  = uZenith;
        float y = clamp(dir.y, 0.0, 1.0);
        // Gradient that leaves the horizon gently (flat at the bottom), so there is no crease where sky meets sea
        vec3 col = mix(horizon, zenith, pow(smoothstep(0.0, 0.75, y), 0.6));
        // Low sea mist: a soft bright band just above the water, a little warmer toward the moon's bearing
        vec2 dXZ = normalize(dir.xz + vec2(1e-5)), mXZ = normalize(uMoonDir.xz + vec2(1e-5));
        float toward = pow(max(dot(dXZ, mXZ), 0.0), 6.0);
        float mist = exp(-y * 16.0);
        col += horizon * 0.3 * mist + uHalo * 0.035 * toward * exp(-y * 9.0);

        // Aurora: soft curtains low in the sky that sway slowly, combed with fine vertical rays
        if (uAurora > 0.001 && dir.y > 0.0) {
          float az = atan(dir.x, -dir.z);
          float base = 0.06 + 0.08 * n2(vec2(az * 1.6 - uTime * 0.035, 3.7));
          float h = dir.y - base;
          float rays = 0.55 + 0.45 * n2(vec2(az * 38.0 + uTime * 0.25, uTime * 0.08));
          float sway = n2(vec2(az * 2.4 + uTime * 0.05, uTime * 0.02 + 9.1));
          float band = smoothstep(-0.01, 0.025, h) * exp(-max(h, 0.0) * 6.5) * rays * smoothstep(0.25, 0.75, sway);
          vec3 aCol = mix(vec3(0.25, 1.0, 0.7), uHalo, 0.35);
          aCol = mix(aCol, vec3(0.75, 0.38, 1.0), smoothstep(0.08, 0.3, h));   // violet fringes on top
          col += aCol * band * uAurora * 0.6;
        }

        float d = max(dot(dir, uMoonDir), 0.0);
        float front = step(0.0, dot(dir, uMoonDir));
        // Halo dims as the moon wanes to a crescent, brightens under the pointer
        float haloK = mix(1.0, 0.42, uMoonPhase) * (1.0 + 0.7 * uMoonHover);
        col += uHalo * 0.78 * haloK * (pow(d, 900.0)*0.40 + pow(d, 70.0)*0.13 + pow(d, 8.0)*0.05);

        vec3 t1 = normalize(cross(uMoonDir, vec3(0.0, 1.0, 0.0)));
        vec3 t2 = cross(t1, uMoonDir);
        vec2 uv = vec2(dot(dir, t1), dot(dir, t2)) / 0.0384;
        float r = length(uv);

        // A ring of light spreads from the moon each time it is tapped
        float pr = 1.05 + uMoonPulse * 5.5;
        float q1 = (r - pr) * 1.5;
        col += uHalo * front * 0.42 * exp(-q1 * q1) * exp(-uMoonPulse * 2.0);
        // Thin rim while hovered, so the moon reads as something to press
        float q2 = (r - 1.16) * 8.0;
        col += uHalo * front * uMoonHover * 0.4 * exp(-q2 * q2);

        if (front > 0.0 && r < 1.02) {
          float mare = n2(uv*2.6+3.1)*0.6 + n2(uv*6.0+9.7)*0.3 + n2(uv*14.0)*0.1;
          vec3 moon = vec3(0.93, 0.95, 0.99) * (0.80 + 0.20*smoothstep(0.38, 0.68, mare));
          moon *= 0.84 + 0.16*sqrt(max(0.0, 1.0 - r*r));
          // Phase: an earth-shadow disc slides across, leaving a crescent while the music rests
          float off = mix(2.3, 0.42, uMoonPhase);
          float sh = 1.0 - smoothstep(0.95, 1.03, length(uv - vec2(off, 0.04)));
          moon = mix(moon, moon * 0.10 + uHorizon * 0.5, sh * smoothstep(0.0, 0.06, uMoonPhase));
          // Hover mark: what a tap will do (pause bars, or a play triangle)
          float glyph;
          if (uMoonGlyph < 0.5) {
            glyph = (1.0 - step(0.08, abs(abs(uv.x) - 0.2))) * (1.0 - step(0.36, abs(uv.y)));
          } else {
            glyph = step(-0.3, uv.x) * (1.0 - step(0.35, uv.x)) * (1.0 - step(0.36 * (0.35 - uv.x) / 0.65, abs(uv.y)));
          }
          moon = mix(moon, moon * 0.4, glyph * uMoonHover * 0.9);
          col = mix(col, moon, 1.0 - smoothstep(0.965, 1.0, r));
        }
        // Drifting clouds: thin wisps sliding across, silvered where the moon is behind them
        if (uCloud > 0.001 && dir.y > 0.0) {
          vec2 cp = dir.xz / (dir.y + 0.12) * 1.6 + vec2(uTime * 0.035, uTime * 0.012);
          float cl = n2(cp) * 0.55 + n2(cp * 2.1 + 4.3) * 0.3 + n2(cp * 4.7 + 1.1) * 0.15;
          cl = smoothstep(0.5, 0.8, cl) * smoothstep(0.0, 0.12, dir.y);
          vec3 cCol = horizon * 1.5 + uHalo * (0.06 + 0.55 * pow(d, 30.0));
          col = mix(col, cCol, cl * uCloud * 0.85);
        }
        // Below the horizon (beyond the end of the sea) the mist simply continues, matching the fog colour
        if (dir.y < 0.0) col = horizon * 1.3 + uHalo * 0.035 * toward;
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 48, 24), skyMat);
  sky.renderOrder = -2;
  scene.add(sky);

  // ---- Stars ----
  const STARS = small ? 1600 : 2900;              // a full sphere: the sky turns, so stars rise and set
  const sPos = new Float32Array(STARS * 3);
  const sSeed = new Float32Array(STARS);
  const sSize = new Float32Array(STARS);
  const tmp = new THREE.Vector3();
  for (let i = 0; i < STARS; i++) {
    const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
    const sq = Math.sqrt(1 - u * u);
    tmp.set(sq * Math.cos(th), u, sq * Math.sin(th));
    tmp.multiplyScalar(450);
    sPos.set([tmp.x, tmp.y, tmp.z], i * 3);
    sSeed[i] = Math.random();
    sSize[i] = Math.random() < 0.06 ? 2.6 + Math.random() * 1.4 : 1.0 + Math.random() * 1.2;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  starGeo.setAttribute('aSeed', new THREE.BufferAttribute(sSeed, 1));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(sSize, 1));
  const starMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uPR: U.uPR, uMoonPhase: U.uMoonPhase, uMoonDir: U.uMoonDir },
    vertexShader: `
      attribute float aSeed; attribute float aSize;
      uniform float uTime; uniform float uPR; uniform float uMoonPhase; uniform vec3 uMoonDir;
      varying float vA;
      void main(){
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        vec3 wd = normalize(mat3(modelMatrix) * position);    // where the turning sky has carried this star
        float tw = 0.62 + 0.38*sin(uTime*(0.5 + aSeed*2.4) + aSeed*40.0);
        // With the moon waned, the stars come out a little more
        vA = tw * smoothstep(0.02, 0.30, wd.y) * (0.45 + 0.55*aSeed) * (1.0 + 0.6 * uMoonPhase);
        vA *= 1.0 - smoothstep(0.996, 0.9985, dot(wd, uMoonDir));   // hidden behind the moon's disc
        gl_PointSize = aSize * uPR;
      }`,
    fragmentShader: `
      varying float vA;
      void main(){
        float d = length(gl_PointCoord - 0.5);
        gl_FragColor = vec4(vec3(0.80, 0.86, 1.0), smoothstep(0.5, 0.0, d) * vA);
      }`
  });
  const stars = new THREE.Points(starGeo, starMat);
  stars.renderOrder = -1;
  scene.add(stars);

  // ================= Sky phenomena =================
  // The star sphere turns slowly about a pole behind the viewer; on top of that the sky cycles through
  // quiet spells and featured events: a meteor shower, aurora, drifting cloud, or a constellation drawn
  // star by star. Lone shooting stars cross now and then in any spell.
  const POLE = new THREE.Vector3(0, 0.6, 0.8).normalize();
  const SKY_TURN = 0.006;                         // rad/s: a slow, visible wheel
  let skyAngle = 0;

  // ---- Constellations: short chains through neighbouring stars, kept on the star sphere ----
  const CONST_N = 3;
  const constV = [], constOrder = [], constGroup = [], constCount = [], constSeed = [];
  const starDir = (k) => new THREE.Vector3(sPos[k * 3], sPos[k * 3 + 1], sPos[k * 3 + 2]).normalize();
  for (let g = 0; g < CONST_N; g++) {
    // seed on a bright star that starts out well up in the sky, in front of the viewer
    let seed = -1;
    for (let tries = 0; tries < 400 && seed < 0; tries++) {
      const k = Math.floor(Math.random() * STARS), v = starDir(k);
      if (sSize[k] > 2.0 && v.y > 0.3 && v.z < 0.2 && v.dot(moonDir) < 0.95) seed = k;
    }
    if (seed < 0) continue;
    const chain = [seed], used = new Set([seed]);
    const len = 5 + Math.floor(Math.random() * 3);
    while (chain.length < len) {
      const cur = starDir(chain[chain.length - 1]);
      let best = -1, bestD = 1e9;
      for (let k = 0; k < STARS; k++) {
        if (used.has(k) || sSize[k] < 1.5) continue;
        const a = cur.angleTo(starDir(k));
        if (a > 0.05 && a < 0.24 && a < bestD) { bestD = a; best = k; }
      }
      if (best < 0) break;
      chain.push(best); used.add(best);
      sSize[best] = Math.max(sSize[best], 2.2);   // stars that belong to a figure shine a little brighter
    }
    for (let k = 0; k + 1 < chain.length; k++) {
      [chain[k], chain[k + 1]].forEach((id, e) => {
        constV.push(sPos[id * 3], sPos[id * 3 + 1], sPos[id * 3 + 2]);
        constOrder.push(k + e);                  // start vertex k, end vertex k+1: the line draws itself
        constGroup.push(g);
      });
    }
    constCount[g] = chain.length - 1;
    constSeed[g] = seed;
  }
  starGeo.attributes.aSize.needsUpdate = true;
  const constGeo = new THREE.BufferGeometry();
  constGeo.setAttribute('position', new THREE.Float32BufferAttribute(constV, 3));
  constGeo.setAttribute('aOrder', new THREE.Float32BufferAttribute(constOrder, 1));
  constGeo.setAttribute('aGroup', new THREE.Float32BufferAttribute(constGroup, 1));
  const constMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
    uniforms: { uDraw: { value: 0 }, uAlpha: { value: 0 }, uWhich: { value: 0 }, uCol: U.uLightCol },
    vertexShader: `
      attribute float aOrder; attribute float aGroup;
      uniform float uDraw; uniform float uAlpha; uniform float uWhich;
      varying float vA;
      void main(){
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        vec3 wd = normalize(mat3(modelMatrix) * position);
        vA = uAlpha * (1.0 - step(0.5, abs(aGroup - uWhich))) * clamp(uDraw - aOrder + 1.0, 0.0, 1.0)
           * smoothstep(0.02, 0.2, wd.y);
      }`,
    fragmentShader: `
      uniform vec3 uCol;
      varying float vA;
      void main(){ gl_FragColor = vec4(mix(uCol, vec3(1.0), 0.5) * 0.55, vA); }`
  });
  const constLines = new THREE.LineSegments(constGeo, constMat);
  constLines.frustumCulled = false;
  stars.add(constLines);                         // turns with the stars

  // ---- Shooting stars: camera-facing streaks travelling along great circles ----
  const MET_N = 12;
  const metPos = new Float32Array(MET_N * 4 * 3);
  const metA = new Float32Array(MET_N * 4);
  const metIdx = [];
  for (let k = 0; k < MET_N; k++) { const b = k * 4; metIdx.push(b, b + 1, b + 2, b + 2, b + 1, b + 3); }
  const metGeo = new THREE.BufferGeometry();
  metGeo.setAttribute('position', new THREE.BufferAttribute(metPos, 3).setUsage(THREE.DynamicDrawUsage));
  metGeo.setAttribute('aA', new THREE.BufferAttribute(metA, 1).setUsage(THREE.DynamicDrawUsage));
  metGeo.setIndex(metIdx);
  const metMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
    uniforms: { uCol: U.uLightCol },
    vertexShader: `
      attribute float aA; varying float vA;
      void main(){ vA = aA; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform vec3 uCol; varying float vA;
      void main(){ gl_FragColor = vec4(mix(uCol, vec3(1.0), 0.6) * vA, vA); }`
  });
  const meteors = new THREE.Mesh(metGeo, metMat);
  meteors.frustumCulled = false;
  meteors.renderOrder = 0;
  scene.add(meteors);
  const metPool = Array.from({ length: MET_N }, () => ({ on: false, t: 0, life: 1, d0: new THREE.Vector3(), axis: new THREE.Vector3(), speed: 0.4, len: 0.15, w: 1 }));
  const UPV = new THREE.Vector3(0, 1, 0);
  const vH = new THREE.Vector3(), vT = new THREE.Vector3(), vS = new THREE.Vector3(), vTan = new THREE.Vector3(), vDn = new THREE.Vector3();
  let radiant = new THREE.Vector3(0, 0.8, -0.6).normalize();

  function launchMeteor(fromRadiant) {
    const m = metPool.find((q) => !q.on);
    if (!m) return;
    if (fromRadiant) {
      // Shower: start a little away from the radiant and fly directly away from it
      const off = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).cross(radiant).normalize();
      m.d0.copy(radiant).applyAxisAngle(off, 0.08 + Math.random() * 0.35);
      vTan.copy(m.d0).multiplyScalar(m.d0.dot(radiant)).sub(radiant).normalize();
    } else {
      // Lone meteor: somewhere ahead and high, falling at a slant
      const az = (Math.random() - 0.5) * 2.2, el = 0.45 + Math.random() * 0.6;
      m.d0.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
      vDn.copy(m.d0).multiplyScalar(m.d0.dot(UPV)).sub(UPV).normalize();
      vS.copy(m.d0).cross(vDn).normalize();
      vTan.copy(vDn).multiplyScalar(0.6).addScaledVector(vS, (Math.random() < 0.5 ? -1 : 1) * 0.8).normalize();
    }
    m.axis.copy(m.d0).cross(vTan).normalize();
    m.speed = 0.35 + Math.random() * 0.3;          // rad/s along the sky
    m.len = 0.1 + Math.random() * 0.12;            // tail length, radians
    m.life = 0.6 + Math.random() * 0.7;
    m.w = 0.55 + Math.random() * 0.5;
    m.t = 0;
    m.on = true;
  }

  function updateMeteors(dt) {
    for (let k = 0; k < MET_N; k++) {
      const m = metPool[k], b = k * 4;
      if (m.on) { m.t += dt; if (m.t >= m.life) m.on = false; }
      if (!m.on) { for (let j = 0; j < 4; j++) metA[b + j] = 0; continue; }
      const env = Math.min(1, m.t / 0.12) * Math.min(1, (m.life - m.t) / 0.3);
      const travel = m.speed * m.t;
      vH.copy(m.d0).applyAxisAngle(m.axis, travel);
      vT.copy(m.d0).applyAxisAngle(m.axis, Math.max(0, travel - m.len * Math.min(1, m.t / 0.25)));
      vS.copy(vH).sub(vT).cross(vH).normalize();
      const R = 340, wH = 0.75 * m.w, wT = 0.12 * m.w;
      metPos.set([vH.x * R + vS.x * wH, vH.y * R + vS.y * wH, vH.z * R + vS.z * wH], b * 3);
      metPos.set([vH.x * R - vS.x * wH, vH.y * R - vS.y * wH, vH.z * R - vS.z * wH], b * 3 + 3);
      metPos.set([vT.x * R + vS.x * wT, vT.y * R + vS.y * wT, vT.z * R + vS.z * wT], b * 3 + 6);
      metPos.set([vT.x * R - vS.x * wT, vT.y * R - vS.y * wT, vT.z * R - vS.z * wT], b * 3 + 9);
      const fadeLow = Math.min(1, Math.max(0, (vH.y - 0.03) / 0.12));   // vanish as they reach the horizon
      metA[b] = metA[b + 1] = env * fadeLow;
      metA[b + 2] = metA[b + 3] = 0;
    }
    metGeo.attributes.position.needsUpdate = true;
    metGeo.attributes.aA.needsUpdate = true;
  }

  // ---- The schedule: quiet spells between featured events ----
  const SKY_EVENTS = [
    { key: 'meteors', name: '流星雨', dur: [18, 26] },
    { key: 'aurora', name: '极光', dur: [30, 40] },
    { key: 'clouds', name: '流云', dur: [30, 42] },
    { key: 'const', name: '星座', dur: [20, 26] }
  ];
  let skyEvent = null, skyTimer = 12, skyLast = '', loneTimer = 5, showerTimer = 0, constWhich = 0, constDraw = 0;
  const skyNote = document.getElementById('skyNote');
  const rnd = (a, b) => a + Math.random() * (b - a);
  function setSkyNote() { skyNote.textContent = '天象 · ' + (skyEvent ? skyEvent.name : '晴夜'); }

  function updateSky(dt) {
    skyAngle += dt * SKY_TURN;
    stars.quaternion.setFromAxisAngle(POLE, skyAngle);

    skyTimer -= dt;
    if (skyTimer <= 0) {
      if (!skyEvent) {
        const pool = SKY_EVENTS.filter((e) => e.key !== skyLast && (e.key !== 'const' || constCount.length));
        skyEvent = pool[Math.floor(Math.random() * pool.length)];
        skyTimer = rnd(skyEvent.dur[0], skyEvent.dur[1]);
        if (skyEvent.key === 'meteors') {
          const az = (Math.random() - 0.5) * 1.6, el = 0.8 + Math.random() * 0.45;
          radiant.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
        }
        if (skyEvent.key === 'const') {
          // The sky has turned since the figures were chosen: draw the one standing highest right now
          let bestY = -2;
          constSeed.forEach((sd, g) => {
            if (sd === undefined) return;
            const y = starDir(sd).applyQuaternion(stars.quaternion).y;
            if (y > bestY) { bestY = y; constWhich = g; }
          });
          constDraw = 0;
        }
      } else {
        skyLast = skyEvent.key;
        skyEvent = null;
        skyTimer = rnd(18, 34);
      }
      setSkyNote();
    }
    const key = skyEvent ? skyEvent.key : '';
    const ease = (u, target, rate) => u.value + (target - u.value) * (1 - Math.exp(-dt * rate));
    U.uAurora.value = ease(U.uAurora, key === 'aurora' ? 1 : 0, 0.35);
    U.uCloud.value = ease(U.uCloud, key === 'clouds' ? 1 : 0, 0.3);

    // Constellation: lines drawn star to star, held, then faded together
    if (key === 'const') constDraw += dt * 1.4;
    constMat.uniforms.uWhich.value = constWhich;
    constMat.uniforms.uDraw.value = constDraw;
    constMat.uniforms.uAlpha.value = ease(constMat.uniforms.uAlpha, key === 'const' ? 1 : 0, key === 'const' ? 3 : 0.8);

    loneTimer -= dt;
    if (loneTimer <= 0) { launchMeteor(false); loneTimer = rnd(6, 14); }
    if (key === 'meteors') {
      showerTimer -= dt;
      if (showerTimer <= 0) { launchMeteor(true); showerTimer = rnd(0.25, 0.8); }
    }
    updateMeteors(dt);
  }

  // ---- Cube ocean: positions live on the GPU, waves computed per instance in the vertex shader ----
  const waveGLSL = WAVES.map(([deg, L, A]) => {
    const a = deg * Math.PI / 180;
    const k = (2 * Math.PI / L);
    const w = Math.sqrt(9.8 * k) * SWELL_SPEED;
    return `r += sw(p, vec2(${Math.sin(a).toFixed(5)}, ${Math.cos(a).toFixed(5)}), ${k.toFixed(5)}, ${A.toFixed(4)}, ${w.toFixed(5)}, t);`;
  }).join('\n');

  const cubeMat = new THREE.MeshStandardMaterial({ color: 0x2b4470, roughness: 0.62, metalness: 0.12 });
  cubeMat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = U.uTime;
    shader.uniforms.uMoonDir = U.uMoonDir;
    shader.uniforms.uSpot = U.uSpot;
    ['uLightCol', 'uAudioT', 'uRip', 'uRipOn', 'uFocusPos', 'uGlow', 'uLevel', 'uMoonPhase', 'uHoldPos', 'uHoldYaw', 'uHoldTilt', 'uHoldW', 'uEdgeOn', 'uFocusEdge', 'uGreyOn', 'uIntro', 'uIntroC', 'uCat', 'uOutro', 'uOutroCore'].forEach((k) => { shader.uniforms[k] = U[k]; });
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        uniform float uTime;
        uniform vec3 uMoonDir;
        uniform float uSpot;
        uniform float uAudioT;
        uniform vec4 uRip[12];
        uniform float uMoonPhase;
        uniform float uRipOn;
        uniform vec2 uFocusPos;
        uniform float uIntro;
        uniform float uCat;
        uniform float uOutro;
        uniform float uOutroCore;
        varying float vOutroGlow;
        attribute vec4 aCat;          // xyz: this cube's place in the cat (world), w: when it sets off (0..1)
        attribute vec3 aCatCol;
        varying float vCatE;
        varying vec3 vCatCol;
        uniform vec2 uIntroC;
        uniform vec2 uHoldPos;
        uniform float uHoldYaw;
        uniform float uHoldTilt;
        uniform float uHoldW;
        uniform float uEdgeOn;
        uniform float uFocusEdge;
        varying vec3 vLocal;
        varying float vEdge;
        varying float vHoldF;
        attribute float aLift;
        attribute float aSpin;
        attribute float aTrack;
        varying float vTrack;
        varying float vGlint;
        varying float vTop;
        varying float vH;
        varying float vLift;
        varying float vRip;
        varying float vFocus;
        float hash1(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        vec3 sw(vec2 p, vec2 d, float k, float A, float w, float t){
          float ph = k * dot(d, p) - w * t;
          float c = cos(ph);
          return vec3(A * sin(ph), A * k * c * d.x, A * k * c * d.y);
        }
        vec3 waveH(vec2 p, float t){
          vec3 r = vec3(0.0);
          ${waveGLSL}
          return r;
        }
        mat3 rotUp(vec3 n){
          vec3 v = vec3(n.z, 0.0, -n.x);
          float c = n.y;
          float k = 1.0 / (1.0 + c);
          return mat3(
            v.x*v.x*k + c,   v.y*v.x*k + v.z, v.z*v.x*k - v.y,
            v.x*v.y*k - v.z, v.y*v.y*k + c,   v.z*v.y*k + v.x,
            v.x*v.z*k + v.y, v.y*v.z*k - v.x, v.z*v.z*k + c
          );
        }`)
      .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
        vec2 ip = vec2(instanceMatrix[3][0], instanceMatrix[3][2]);
        vec3 wv = waveH(ip, uTime);
        vH = wv.x;
        vec3 wn = normalize(vec3(-wv.y, 1.0, -wv.z));
        vLift = aLift;
        vTrack = aTrack;
        // A lifted cube levels out, tips onto an edge and turns slowly
        mat3 R = rotUp(normalize(mix(vec3(-wv.y*0.75, 1.0, -wv.z*0.75), vec3(0.0, 1.0, 0.0), aLift)));
        // (spin phase uses a plain fract() so the page can reproduce it exactly for the lyric face)
        // Spin angle is accumulated per cube on the page (only while it is lifted), so it never
        // depends on how long the page has been open
        float sa = aSpin;
        float ta = aLift * 0.42;
        // The singing cube with lyrics is steered from the page: it turns one face to the camera and holds it
        float hold = (1.0 - step(0.3, length(ip - uHoldPos))) * uHoldW;
        sa = mix(sa, uHoldYaw, hold);
        ta = mix(ta, uHoldTilt, hold);
        vHoldF = hold;
        mat3 S = mat3(cos(sa), 0.0, -sin(sa),  0.0, 1.0, 0.0,  sin(sa), 0.0, cos(sa));
        mat3 T = mat3(1.0, 0.0, 0.0,  0.0, cos(ta), sin(ta),  0.0, -sin(ta), cos(ta));
        mat3 M = R * T * S;
        float catP = clamp((uCat - aCat.w * 0.55) / 0.45, 0.0, 1.0);
        float catE = catP * catP * (3.0 - 2.0 * catP);
        vCatE = catE;
        vCatCol = aCatCol;
        vTop = objectNormal.y;
        objectNormal = normalize(mix(M * objectNormal, objectNormal, catE));   // square to the world inside the cat

        vec3 wp = vec3(ip.x, wv.x, ip.y);
        vec3 Vd = normalize(cameraPosition - wp);
        vec3 Hd = normalize(uMoonDir + Vd);
        float spec = pow(max(dot(wn, Hd), 0.0), 80.0);
        float s1 = hash1(ip);
        float s2 = hash1(ip + 17.31);
        float tw = 0.5 + 0.5 * sin(uTime * (1.8 + s1 * 5.5) + s2 * 6.2831);
        tw = tw * tw * tw;
        vGlint = (1.0 - catE) * 0.16 * (spec * (0.25 + 2.9 * tw) + pow(tw, 14.0) * 0.06 * step(0.9, s1)) * (1.0 - 0.7 * aLift) * (1.0 - 0.5 * uSpot) * (1.0 - 0.5 * uMoonPhase);

        // Rings spreading out from the singing cube, one per beat
        float dd = length(ip - uFocusPos);
        vFocus = 1.0 - step(0.3, dd);
        // Edge glow follows the hover lift on the main view; the locked cube never gets it
        vLocal = position;
        // The cube being locked fades its own edges out (uFocusEdge) instead of losing them at once
        vEdge = aLift * mix(uEdgeOn, uFocusEdge, vFocus) * (1.0 - catE);
        float rip = 0.0;
        if (uRipOn > 0.001) {
          for (int k = 0; k < 12; k++) {
            float age = uAudioT - uRip[k].x;
            if (age > 0.0 && age < 5.5) {
              // each ring keeps its own centre, so rings from a previous cube finish where they began
              float x = length(ip - uRip[k].zw) - 0.6 - age * 7.0;
              rip += uRip[k].y * exp(-x * x * 0.55) * (1.0 - age / 5.5) * (1.0 - age / 5.5);
            }
          }
          rip *= uRipOn * (1.0 - vFocus);
        }
        vRip = rip;`)
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        transformed = M * transformed;
        // Opening: the sea unfolds from the middle outward; each cube rises from below the water and grows into place
        float iD = clamp(length(ip - uIntroC) / 150.0, 0.0, 1.0);
        float iP = clamp((uIntro * 1.35 - iD) / 0.35, 0.0, 1.0);
        float iE = iP * iP * (3.0 - 2.0 * iP);
        transformed *= iE;
        transformed.xz += (uIntroC - ip) * (1.0 - iE) * 0.3;
        transformed.y -= (1.0 - iE) * 1.6;
        // Closing: the sea draws back into its centre cube, farthest cubes first, each shrinking as it arrives;
        // the centre cube brightens as they gather, then goes out
        vOutroGlow = 0.0;
        if (uOutro > 0.0) {
          float oDist = length(ip - uIntroC);
          if (oDist < 0.3) {
            transformed *= 1.0 - smoothstep(0.0, 1.0, uOutroCore);
            vOutroGlow = smoothstep(0.2, 1.0, uOutro) * (1.0 - uOutroCore);
          } else {
            float oD = clamp(oDist / 150.0, 0.0, 1.0);
            float oP = clamp((uOutro * 1.3 - (1.0 - oD)) / 0.3, 0.0, 1.0);
            float oE = oP * oP * (3.0 - 2.0 * oP);
            transformed *= 1.0 - smoothstep(0.7, 1.0, oE);
            transformed.xz += (uIntroC - ip) * oE;
            transformed.y += sin(oE * 3.1416) * (0.4 + 2.0 * oD);
          }
        }
        transformed.y += vH + vRip * 0.75 + aLift * (2.3 + 0.18 * sin(uTime * 1.7 + fract(ip.x * 0.3713 + ip.y * 0.7191) * 6.2831));
        // Easter egg: fly to this cube's place in the cat on a low arc (and back again when it comes apart)
        if (catE > 0.0) {
          vec3 inCat = position + vec3(aCat.x - ip.x, aCat.y, aCat.z - ip.y);
          transformed = mix(transformed, inCat, catE);
          transformed.y += sin(catE * 3.1416) * (2.0 + aCat.w * 6.0);
        }`);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        varying float vGlint;
        varying float vTop;
        varying float vH;
        varying float vLift;
        varying float vRip;
        varying float vFocus;
        uniform vec3 uLightCol;
        uniform float uGlow;
        uniform float uLevel;
        uniform float uTime;
        varying vec3 vLocal;
        varying float vEdge;
        varying float vHoldF;
        varying float vTrack;
        uniform float uGreyOn;
        varying float vCatE;
        varying vec3 vCatCol;
        varying float vOutroGlow;`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, 1.0, vHoldF);   // no sheen on the cube carrying lyrics`)
      .replace('#include <metalnessmap_fragment>', `#include <metalnessmap_fragment>
        metalnessFactor = mix(metalnessFactor, 0.0, vHoldF);`)
      .replace('#include <color_fragment>', `#include <color_fragment>
        // Library view (no song playing): cubes holding a song wear its cover colour, the others turn a little grey
        if (uGreyOn > 0.001) {
          float lum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));
          vec3 greyed = mix(diffuseColor.rgb, vec3(lum) * 1.05, 0.65);
          vec3 brighter = diffuseColor.rgb * 1.75 + vec3(0.02);   // the scene's own tone, lifted
          diffuseColor.rgb = mix(diffuseColor.rgb, mix(greyed, brighter, vTrack), uGreyOn);
        }
        // wave shading (troughs darker); song cubes in the library view keep most of their brightness in the troughs
        float waveShade = mix(0.5 + 0.65 * smoothstep(-1.5, 1.5, vH), 1.35, vLift);
        diffuseColor.rgb *= mix(waveShade, max(waveShade, 1.05), vTrack * uGreyOn * 0.7);
        diffuseColor.rgb *= 1.0 - 0.6 * vHoldF;              // darker ground under the printed faces
        diffuseColor.rgb = mix(diffuseColor.rgb, vCatCol, vCatE);   // the cat's own colours`)
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float topW = max(vTop, 0.0);
        totalEmissiveRadiance += uLightCol * vGlint * (0.12 + 0.88 * topW);
        totalEmissiveRadiance += uLightCol * 0.64 * vLift * (0.10 + 0.22 * topW);
        // Cubes holding a song from your playlist keep a faint glow on top, so the album reads on the sea
        totalEmissiveRadiance += diffuse * vTrack * uGreyOn * (0.22 + 0.3 * topW);   // song cubes glow softly in the scene's tone
        totalEmissiveRadiance += vCatCol * vCatE * 0.16;      // lit enough to read against the night
        totalEmissiveRadiance += uLightCol * vOutroGlow * 1.3;     // the last cube, holding the whole sea
        // Ripple crests catch the song's light
        totalEmissiveRadiance += uLightCol * vRip * (0.18 + 0.5 * topW);
        // The singing cube: three countdown flashes, then breathes with the music
        totalEmissiveRadiance += uLightCol * vFocus * (uGlow * 1.5 + uLevel * 0.9 * (1.0 - 0.7 * vHoldF));
        // Hovered cube: its twelve edges light up (two coordinates at the boundary = an edge)
        if (vEdge > 0.001) {
          // A single crisp line along each edge: a very narrow band at the boundary, no fill on the faces
          vec3 ap = smoothstep(vec3(0.384), vec3(0.396), abs(vLocal));
          float edge = clamp(ap.x + ap.y + ap.z - 1.0, 0.0, 1.0);
          totalEmissiveRadiance += uLightCol * vEdge * edge * 1.8;
        }`);
  };

  const cube = new THREE.BoxGeometry(SIZE, SIZE, SIZE);
  const catAttr = new THREE.InstancedBufferAttribute(new Float32Array(COUNT * 4), 4);
  const catColAttr = new THREE.InstancedBufferAttribute(new Float32Array(COUNT * 3), 3);
  cube.setAttribute('aCat', catAttr);
  cube.setAttribute('aCatCol', catColAttr);
  const sea = new THREE.InstancedMesh(cube, cubeMat, COUNT);
  sea.frustumCulled = false;
  const m = new THREE.Matrix4();
  const zStart = 16;
  let i = 0;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = (c - (COLS - 1) / 2) * GAP;
      const z = zStart - r * GAP;
      m.makeTranslation(x, 0, z);
      sea.setMatrixAt(i++, m);
    }
  }
  sea.instanceMatrix.needsUpdate = true;
  scene.add(sea);

  // Open water: a dark sea surface just under the troughs, running out past the last row of cubes to the
  // horizon (6 km out, where the fog has fully taken it), so the sea meets the sky instead of stopping short.
  // It also fills the gaps between cubes with deep water rather than background haze.
  const seaFloor = new THREE.Mesh(
    new THREE.PlaneGeometry(12000, 12000),
    new THREE.MeshStandardMaterial({ color: 0x0e1626, roughness: 0.9, metalness: 0 })
  );
  seaFloor.rotation.x = -Math.PI / 2;
  seaFloor.position.set(0, -1.05, 0);
  seaFloor.renderOrder = -0.5;
  scene.add(seaFloor);

  // ---- Focused moonlight: a spotlight plus a visible beam, both off until a cube is locked ----
  // Comes from high on the moon's side, so it falls on the cube's top and rim as the camera sees it
  const beamDir = new THREE.Vector3(0, 1, -0.5).normalize();
  const spot = new THREE.SpotLight(0xdfe8ff, 0, 0, 0.085, 0.75, 1);
  spot.target = new THREE.Object3D();
  scene.add(spot, spot.target);

  const BEAM_H = 26;
  const beamGeo = new THREE.CylinderGeometry(0.22, 1.15, BEAM_H, 48, 1, true);
  beamGeo.translate(0, BEAM_H / 2, 0);
  const beamMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, fog: false,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
    uniforms: { uTime: U.uTime, uReveal: { value: 0 }, uIntensity: { value: 0 }, uLightCol: U.uLightCol },
    vertexShader: `
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){
        vUv = uv;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vN = normalize(normalMatrix * normal);
        vV = normalize(-mv.xyz);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uTime; uniform float uReveal; uniform float uIntensity;
      uniform vec3 uLightCol;
      varying vec2 vUv; varying vec3 vN; varying vec3 vV;
      void main(){
        float along = vUv.y;                                   // 1 = moon end, 0 = cube end
        float edge = pow(abs(dot(normalize(vN), normalize(vV))), 2.2);
        float reveal = smoothstep(1.0 - uReveal - 0.10, 1.0 - uReveal, along);
        float fade = smoothstep(1.0, 0.3, along) * (0.4 + 0.6 * smoothstep(0.0, 0.06, along));
        float drift = 0.82 + 0.18 * sin(along * 46.0 - uTime * 1.3 + vUv.x * 31.4);
        float a = edge * fade * reveal * drift * uIntensity * 0.30;
        gl_FragColor = vec4(uLightCol * 0.93 * a, a);
      }`
  });
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), beamDir);
  beam.visible = false;
  beam.frustumCulled = false;
  beam.renderOrder = 2;
  scene.add(beam);
  let spotP = 0;

  // ================= Music =================
  // Every cube owns one piece, derived from its index: key, mode, tempo, motif, timbre and palette.
  // All of it is synthesised live with Web Audio, so 30,000 cubes need no audio files.
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let q = Math.imul(a ^ (a >>> 15), 1 | a);
      q = (q + Math.imul(q ^ (q >>> 7), 61 | q)) ^ q;
      return ((q ^ (q >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Each mode carries its own colour of night
  const MODES = [
    { name: '伊奥尼亚',   steps: [0, 2, 4, 5, 7, 9, 11], hue: 0.095, sat: 0.62 }, // lantern amber
    { name: '利底亚',     steps: [0, 2, 4, 6, 7, 9, 11], hue: 0.505, sat: 0.60 }, // glacier cyan
    { name: '混合利底亚', steps: [0, 2, 4, 5, 7, 9, 10], hue: 0.975, sat: 0.55 }, // coral rose
    { name: '多利亚',     steps: [0, 2, 3, 5, 7, 9, 10], hue: 0.405, sat: 0.55 }, // aurora jade
    { name: '爱奥利亚',   steps: [0, 2, 3, 5, 7, 8, 10], hue: 0.725, sat: 0.55 }, // deep violet
    { name: '弗里几亚',   steps: [0, 1, 3, 5, 7, 8, 10], hue: 0.875, sat: 0.55 }  // magenta dusk
  ];
  const NOTE_NAMES = ['C', 'C♯', 'D', 'E♭', 'E', 'F', 'F♯', 'G', 'A♭', 'A', 'B♭', 'B'];
  const W1 = ['潮', '雾', '萤', '霜', '汐', '鲸', '灯', '沙', '银', '苇', '帆', '礁', '珊瑚', '玻璃', '回声', '月'];
  const W2 = ['夜曲', '慢板', '摇篮曲', '低语', '回旋曲', '咏叹调', '船歌', '序曲', '余音', '小调'];
  const PROGS = [[0, 5, 3, 4], [0, 3, 4, 0], [0, 4, 5, 3], [5, 3, 0, 4], [0, 2, 3, 4], [0, 5, 1, 4], [3, 4, 0, 0], [0, 6, 5, 4]];

  function songFor(idx) {
    const R = rng(Math.imul(idx + 1, 2654435761) ^ 0x5bd1e995);
    const mode = MODES[Math.floor(R() * MODES.length)];
    const root = 45 + Math.floor(R() * 12);
    const bpm = Math.round(68 + R() * 44);
    const prog = PROGS[Math.floor(R() * PROGS.length)];
    const motif = Array.from({ length: 16 }, () => (R() < 0.5 ? Math.floor(R() * 7) + (R() < 0.25 ? 7 : 0) : -1));
    motif[0] = [0, 2, 4][Math.floor(R() * 3)];
    const song = {
      idx, mode, root, bpm, prog, motif,
      fmRatio: [2.0, 3.0, 3.5, 1.5, 4.0][Math.floor(R() * 5)],
      kick: 0.55 + R() * 0.45,
      hat: R() < 0.55,
      padType: R() < 0.5 ? 'sawtooth' : 'triangle',
      hue: (mode.hue + (R() - 0.5) * 0.06 + 1) % 1,
      sat: mode.sat,
      title: '《' + W1[Math.floor(R() * W1.length)] + '之' + W2[Math.floor(R() * W2.length)] + '》'
    };
    // Drawn after everything above, so adding lyrics didn't change any cube's existing tune or colours
    song.lyrics = R() < 0.6 ? makeLyrics(R, idx) : null;
    return song;
  }

  // ---- Lyrics: eight short lines per song, written from a small night-sea vocabulary ----
  const LN = ['月光', '潮声', '海风', '远帆', '星河', '灯火', '浪花', '礁石', '雾', '夜色', '鲸歌', '银沙', '萤火', '回声', '涟漪', '晚风'];
  const LV_PLACE = ['漂过', '落在', '停在', '沉入', '路过', '睡在'];
  const LV_OBJ = ['照亮', '拥抱', '轻吻', '唤醒', '穿过', '收起'];
  const LP = ['你的肩上', '我的掌心', '海的尽头', '方块之间', '无人的岸', '梦的边缘', '夜的深处', '水面之上', '十二度的天空'];
  const LA = ['慢慢地', '轻轻地', '悄悄地', '一遍又一遍地'];
  function makeLyrics(R, idx) {
    const pick = (a) => a[Math.floor(R() * a.length)];
    const T = [
      () => pick(LN) + pick(LV_PLACE) + pick(LP),
      () => pick(LA) + pick(LV_OBJ) + pick(LN),
      () => '我听见' + pick(LN) + '在' + pick(LP),
      () => '把' + pick(LN) + '折成纸船',
      () => '等' + pick(LN) + '回来',
      () => { const a = pick(LN); let b = pick(LN); if (b === a) b = '你'; return a + '和' + b + '都睡了'; },
      () => '你说' + pick(LN) + '很远',
      () => pick(LN) + '从不说再见'
    ];
    // Each line shape is used once per song (shuffled), so no song leans on one phrase
    for (let k = T.length - 1; k > 0; k--) { const j = Math.floor(R() * (k + 1)); [T[k], T[j]] = [T[j], T[k]]; }
    const lines = T.map((f) => f());
    // The refrain returns at the end of each verse; one line names the cube's own place on the sea
    lines[7] = lines[3];
    lines[Math.floor(R() * 3)] = '第 ' + (Math.floor(idx / COLS) + 1) + ' 行，第 ' + (idx % COLS + 1) + ' 列';
    return lines;
  }

  function paletteFor(s) {
    const c = (h, sa, l) => new THREE.Color().setHSL((h + 1) % 1, Math.min(1, sa), l);
    return {
      horizon: c(s.hue, s.sat * 0.75, 0.12),
      zenith: c(s.hue + 0.04, s.sat * 0.8, 0.03),
      light: c(s.hue, s.sat * 1.3, 0.76),
      sea: c(s.hue, s.sat * 0.6, 0.26),
      hemi: c(s.hue, s.sat * 0.6, 0.22)
    };

    return { times: Float32Array.from(times), str: Float32Array.from(str), bpm };
  }
  const firstAfter = (arr, x) => { let a = 0, b = arr.length; while (a < b) { const m = (a + b) >> 1; if (arr[m] <= x) a = m + 1; else b = m; } return a; };

  function startTrackSession(idx, k) {
    const ctx = ensureAudio();
    if (!ctx || !imported) return;
    stopSession();
    ensureTrackChain(ctx);
    const t = imported.tracks[k];
    const s = {
      isTrack: true, idx, k, title: t.title || '未命名', artist: t.artist || '', album: t.album || '',
      hue: hueOf((t.title || '') + (t.artist || '')), sat: 0.55, lyrics: null, root: 57
    };
    // Countdown: two silent flashes and their rings, as for any cube
    const master = ctx.createGain(); master.gain.value = 0.9;
    const bus = ctx.createGain(); bus.connect(master); master.connect(outGain);
    const now = ctx.currentTime + 0.1, gap = 0.75;
    const counts = [now, now + gap];
    const fx = cellX(idx), fz = cellZ(idx);
    counts.forEach((ct) => rippleQueue.push({ t: ct, s: 0.5, x: fx, z: fz }));
    const S = {
      kind: 'track', s, t, ctx, bus, master, analyser: trackAnalyser, counts, startAt: now + gap * counts.length, fx, fz,
      pal: paletteFor(s), dur: t.duration || 240, started: false, failed: false,
      buf: new Uint8Array(trackAnalyser.fftSize),
      lastBeat: -1, lrc: null, li: 0,
      beats: null, bi: 0, beatPos: 0,                     // tracked beats (once the file is analysed)

    };
    S.elapsed = () => (S.started ? audioEl.currentTime : S.ctx.currentTime - S.startAt);
    beatsFor(t).then((b) => {

      S.beats = b;
      S.beatPos = S.started ? audioEl.currentTime : 0;
      S.bi = firstAfter(b.times, S.beatPos);
    });
    session = S;
    audioOwner = S;
    trackGain.gain.cancelScheduledValues(ctx.currentTime);
    trackGain.gain.setValueAtTime(0, ctx.currentTime);     // silent until the song starts, then it fades in
    audioEl.src = t.url;
    audioEl.load();
    // Lyrics: timed lines (from an .lrc file or timed embedded lyrics) or plain text spread over the song
    if (t.lrc && t.lrc.length) { S.lrc = t.lrc; s.lyrics = t.lrc.map((l) => l.text); }
    else if (t.plain && t.plain.length) { S.plain = t.plain; if (t.duration) spreadLyrics(S); }

    if (t.coverUrl) {

  // A generated piece rises over its first second and falls away over its last one

    else g.setValueAtTime(1, now);                   // after a seek, carry straight on

  function stopSession() {

  function schedule() {

    while (S.nextT < now - 0.05) { S.step++; S.nextT += S.stepDur; }
    while (S.nextT < now + 0.3 && S.step * S.stepDur < S.dur) { playStep(S, S.step, S.nextT); S.step++; S.nextT += S.stepDur; }

  // Jump to a time in the current song (only once the countdown is over)
  function seekTo(sec) {
    const S = session;
    if (!S || S.ctx.currentTime < S.startAt) return;
    if (S.kind === 'track') {

      rippleQueue.length = 0;
      return;
    }
    sec = Math.max(0, Math.min(S.dur - 0.25, sec));
    const now = S.ctx.currentTime;
    S.startAt = now - sec;
    S.step = Math.ceil(sec / S.stepDur);
    S.nextT = S.startAt + S.step * S.stepDur;

    rippleQueue.length = 0;
  }

  function playStep(S, step, time) {
    const s = S.s, ctx = S.ctx;
    const st = step % 64;                    // 8 bars of eighth notes
    const bar = Math.floor(st / 8), inBar = st % 8;
    const chord = s.prog[Math.floor(bar / 2)];
    const deg = (d) => s.root + s.mode.steps[((d % 7) + 7) % 7] + 12 * Math.floor(d / 7);

    if (st % 16 === 0) vPad(ctx, S.bus, [0, 2, 4].map((o) => midiF(deg(chord + o) + 12)), time, S.stepDur * 16, s.padType);
    if (inBar === 0 || (inBar === 4 && bar % 2 === 1)) vBass(ctx, S.bus, midiF(deg(chord)), time, S.stepDur * 3.5);
    if (inBar % 2 === 0) {
      const down = inBar === 0;
      vKick(ctx, S.mgain, time, (down ? 1 : 0.5) * s.kick);
      rippleQueue.push({ t: time, s: down ? 1.0 : 0.5, x: S.fx, z: S.fz });
    } else if (s.hat) {
      vHat(ctx, S.mgain, time);
    }
    const md = s.motif[st % 16];
    if (md >= 0 && step >= 16) {             // melody joins after the first phrase
      const phrase = Math.floor(step / 16);
      vBell(ctx, S.bus, midiF(deg(md + chord + (phrase % 4 === 3 ? 2 : 0)) + 24), time, (st % 4 === 0) ? 1 : 0.65, s.fmRatio);
    }
  }

  function updateMusic(dt) {
    if (locked >= 0 && sessionFor !== locked && focusP >= 0.98) {

    const S = session;
    const at = actx ? actx.currentTime : 0;
    U.uAudioT.value = at;

    while (rippleQueue.length && rippleQueue[0].t <= at) {

          } else {

          S.analyser.getFloatFrequencyData(S.fdb);

          let pw = 0;
          for (let b = 1; b * binHz <= 160; b++) pw += Math.pow(10, S.fdb[b] / 10);
          const lg = Math.log(pw + 1e-9);
          const flux = S.prevLog === null ? 0 : Math.max(0, lg - S.prevLog);

        for (let k = 0; k < S.buf.length; k++) { const v = (S.buf[k] - 128) / 128; sum += v * v; }
        target = Math.min(1, Math.sqrt(sum / S.buf.length) * 4.5);

    U.uLevel.value = level;

      else {

          ? (S.s.isTrack
            ? '♪ ' + S.s.title + (S.s.artist ? ' · ' + S.s.artist : '') + (S.s.failText ? ' · ' + S.s.failText : '')
            : '♪ ' + S.s.title + ' · ' + NOTE_NAMES[S.s.root % 12] + ' ' + S.s.mode.name + ' · ' + S.s.bpm + ' BPM' + (S.s.lyrics ? ' · 有歌词' : ' · 纯音乐'))
          : phase === 'paused'

    // Ease the whole scene toward the song's palette (or back to moonlight)
    const k = 1 - Math.exp(-dt * 0.9);
    U.uHorizon.value.lerp(palTarget.horizon, k);
    U.uZenith.value.lerp(palTarget.zenith, k);
    U.uLightCol.value.lerp(palTarget.light, k);
    cubeMat.color.lerp(palTarget.sea, k);
    seaFloor.material.color.copy(cubeMat.color).multiplyScalar(0.4);   // the deep water under the cubes
    hemi.color.lerp(palTarget.hemi, k);

    scene.fog.color.copy(U.uHorizon.value).multiplyScalar(1.3);
    renderer.setClearColor(scene.fog.color, 1);
    moonLight.color.copy(U.uLightCol.value).multiplyScalar(0.92);
    spot.color.copy(U.uLightCol.value).multiplyScalar(1.08);
  }

  // ---- Lift: one value per cube, eased toward 1 while pointed at, back to 0 after ----
  const LIFT_H = 2.3;
  const lift = new Float32Array(COUNT);
  const liftAttr = new THREE.InstancedBufferAttribute(lift, 1);
  liftAttr.setUsage(THREE.DynamicDrawUsage);
  cube.setAttribute('aLift', liftAttr);
  // Spin: raw angle advances slowly while a cube is up; the value sent to the shader blends toward the

  const SPIN_SPEED = 0.14;                       // rad/s at full lift
  const spinRaw = new Float32Array(COUNT);
  const spin = new Float32Array(COUNT);
  const spinAttr = new THREE.InstancedBufferAttribute(spin, 1);
  spinAttr.setUsage(THREE.DynamicDrawUsage);
  cube.setAttribute('aSpin', spinAttr);

  // ---- Imported playlist: songs laid out in a block in front of the camera, in playlist order ----
  // (row by row, nearest row first, left to right; next / previous follow this order)
  const MAX_TRACKS = 3000;
  let imported = null;                          // { name, tracks: [{ title, artist, album, url, coverUrl, lrc, plain, duration }] }
  const trackOfCube = new Map();                // cube index → song index
  let cubeOfTrack = [];                         // song index → cube index
  const trackMark = new Float32Array(COUNT);
  const trackAttr = new THREE.InstancedBufferAttribute(trackMark, 1);
  cube.setAttribute('aTrack', trackAttr);
  function placeTracks(data) {
    trackOfCube.clear();

    imported = data && Array.isArray(data.tracks) && data.tracks.length ? data : null;
    if (imported) {
      const n = Math.min(imported.tracks.length, MAX_TRACKS);
      const cols = Math.min(COLS - 4, Math.max(8, Math.ceil(Math.sqrt(n * 2.4))));
      const c0 = Math.floor((COLS - cols) / 2), r0 = 10;   // starts about 16 units in front of the camera

  const QUARTER = Math.PI / 2;
  const active = new Set();
  let hovered = -1;

  // Same swell as the shader, so the pointer lands on the cube you see
  const WJS = WAVES.map(([deg, L, A]) => {
    const a = deg * Math.PI / 180, k = 2 * Math.PI / L;
    return { dx: Math.sin(a), dz: Math.cos(a), k, A, w: Math.sqrt(9.8 * k) * SWELL_SPEED };
  });
  function hAt(x, z, tt) {

    return h;

  const cellZ = (idx) => zStart - Math.floor(idx / COLS) * GAP;

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const tmpC = new THREE.Vector3();
  let px = 0, py = 0, pointerIn = false, touchTimer = 0;

  function pick(tt) {
    if (U.uIntro.value < 0.97 || U.uCat.value > 0.001 || outro.on) return -1;
    if (!pointerIn) return -1;
    ndc.set((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const o = raycaster.ray.origin, d = raycaster.ray.direction;

    // Keep hold of a cube that is already in the air

      const cx0 = cellX(hovered), cz0 = cellZ(hovered);
      tmpC.set(cx0, hAt(cx0, cz0, tt) + lift[hovered] * LIFT_H, cz0).sub(o);
      const along = tmpC.dot(d);
      if (along > 0 && tmpC.lengthSq() - along * along < 0.6 * 0.6) return hovered;
    }
    if (d.y > -0.002) return -1;

    const top = SIZE * 0.5, step = 0.3;
    let s = 0.5, hit = -1;
    for (; s < 260; s += step) {
      const y = o.y + d.y * s;

      if (y < hAt(o.x + d.x * s, o.z + d.z * s, tt) + top) { hit = s; break; }
    }
    if (hit < 0) return -1;
    let a = hit - step, b = hit;
    for (let k = 0; k < 7; k++) {

    // so the swell drifting under a still pointer doesn't hop to a neighbour
    if (hovered >= 0) {
      const margin = GAP * 0.5 + 0.32;
      if (Math.abs(x - cellX(hovered)) < margin && Math.abs(z - cellZ(hovered)) < margin) return hovered;
    }
    const c = Math.round(x / GAP + (COLS - 1) / 2);
    const r = Math.round((zStart - z) / GAP);
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
    return r * COLS + c;
  }

  // ---- Lock + close-up ----
  let locked = -1;          // cube held in the air
  let focusCell = -1;       // cube the camera is framing (kept while zooming back out)
  let focusP = 0;           // 0 = wide view, 1 = close-up
  let pendingTap = null;    // a click/tap handled on the next frame, after picking
  const focusC = new THREE.Vector3();
  const lockBtn = document.getElementById('unlock');
  const coord = document.getElementById('coord');

  // ---- Sea view: pull back to the wide shot while the cube keeps singing ----
  const seaBtn = document.getElementById('seaview');
  const SEA_AFTER = 10;            // seconds of close-up listening before the camera pulls back on its own
  let seaView = false;             // camera wants the wide shot even though a cube is locked
  let seaP = 0;                    // eased 0 (close-up) → 1 (wide)
  let closeTimer = 0;              // seconds spent in the close-up with music playing

  function setSeaView(v) {
    seaView = v;
    closeTimer = 0;
    seaBtn.textContent = v ? '返回特写' : '观海模式';

  }
  seaBtn.addEventListener('click', () => { if (locked >= 0) setSeaView(!seaView); });

  // ---- The moon as play / pause (sea view only) ----
  const MOON_R = Math.sin(2.2 * Math.PI / 180);
  const moonV = new THREE.Vector3();
  let moonHover = 0, moonPhase = 0, moonPulseAt = -99, moonHoverOn = false;
  const moonActive = () => locked >= 0 && seaView && seaP > 0.85;
  function overMoon(x, y) {
    moonV.copy(camera.position).addScaledVector(moonDir, 400).project(camera);
    if (moonV.z > 1) return false;
    const mx = (moonV.x + 1) / 2 * innerWidth, my = (1 - moonV.y) / 2 * innerHeight;
    const rPx = MOON_R / Math.tan(camera.fov * Math.PI / 360) * innerHeight / 2;
    return Math.hypot(x - mx, y - my) < rPx * 1.6 + 8;   // a forgiving target around a small disc
  }
  function setMusicPaused(v) {
    musicPaused = v;
    syncAudio();
  }
  function toggleMusic() {
    setMusicPaused(!musicPaused);
    moonPulseAt = performance.now() / 1000;
    closeTimer = 0;
  }

  function setLockLabel(idx) {
    const r = Math.floor(idx / COLS) + 1, c = idx % COLS + 1;
    coord.textContent = '已锁定 · 第 ' + r + ' 行 第 ' + c + ' 列' +
      (seaView ? ' · 观海中，点击月亮暂停或播放' : ' · 按住拖动切换相邻方块');
    coord.hidden = false;
  }
  function lockCube(idx) {
    musicPaused = false;
    ensureAudio();                 // must happen inside the click/tap so the browser allows sound
    if (!playing) setPlaying(true); else syncAudio();
    locked = idx;
    focusCell = idx;
    active.add(idx);
    hovered = -1;
    U.uFocusEdge.value = Math.min(1, lift[idx] + 0.2);   // it was glowing as the hovered cube; fade from there
    setSeaView(false);
    setLockLabel(idx);

    seaBtn.hidden = false;

  }
  // Hand the close-up, the beam and the music over to a neighbouring cube
  function switchTo(idx) {

    sessionFor = -1;
    if (musicPaused) setMusicPaused(false);     // a new cube always gets to sing
    locked = idx;
    focusCell = idx;
    active.add(idx);
    closeTimer = 0;
    setLockLabel(idx);
  }
  // Screen direction → grid neighbour: right/left = next column, up = the row further out to sea
  function neighbour(idx, dir) {
    let c = idx % COLS, r = Math.floor(idx / COLS);
    if (dir === 'right') c++; else if (dir === 'left') c--;
    else if (dir === 'up') r++; else if (dir === 'down') r--;
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return -1;
    return r * COLS + c;
  }

  // ---- Drag to switch (only while a cube is locked) ----
  const DRAG_STEP = 70;            // px of travel that hands over to the next cube
  const drag = { on: false, id: null, x0: 0, y0: 0, moved: false, dx: 0, dy: 0 };
  const nudge = new THREE.Vector2(); // eased camera lean that follows the drag

  function dragStart(ev) {
    drag.on = true; drag.id = ev.pointerId; drag.moved = false;
    drag.x0 = ev.clientX; drag.y0 = ev.clientY; drag.dx = 0; drag.dy = 0;
    closeTimer = 0;
    document.body.style.cursor = 'grabbing';
  }
  function dragMove(ev) {
    if (!drag.on || ev.pointerId !== drag.id) return;

    drag.dy = ev.clientY - drag.y0;
    if (!drag.moved && Math.hypot(drag.dx, drag.dy) > 8) drag.moved = true;
    if (!drag.moved || locked < 0) return;
    const ax = Math.abs(drag.dx), ay = Math.abs(drag.dy);
    if (Math.max(ax, ay) < DRAG_STEP) return;
    const dir = ax > ay ? (drag.dx > 0 ? 'right' : 'left') : (drag.dy < 0 ? 'up' : 'down');

  // ================= Lyrics =================
  // One canvas, shared by two placements: a sheet of words on the singing cube (close-up)
  // and a line of words in the sky just under the moon (sea view). Lines light up karaoke-style.
  const LYR_W = 1024, LYR_H = 256;
  const lyrCanvas = document.createElement('canvas');
  lyrCanvas.width = LYR_W; lyrCanvas.height = LYR_H;
  const lyr2d = lyrCanvas.getContext('2d');
  const lyrTex = new THREE.CanvasTexture(lyrCanvas);

  const LYR_FONT = '"Noto Serif SC", "Songti SC", "STSong", "SimSun", serif';
  let lyricDirty = true, lyrText = '', lyrProg = -1;

  function drawLyric(text, prog) {
    lyr2d.clearRect(0, 0, LYR_W, LYR_H);

  function lyricMat() {
    return new THREE.MeshBasicMaterial({ map: lyrTex, transparent: true, depthWrite: false, fog: false, opacity: 0 });
  }
  const plane = new THREE.PlaneGeometry(1, LYR_H / LYR_W);
  const skyLyric = new THREE.Mesh(plane, lyricMat());
  skyLyric.renderOrder = 1;
  skyLyric.visible = false;
  scene.add(skyLyric);

  // Square face canvas: the line set in a character grid sized to one face of the cube
  const FACE = 512;
  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = faceCanvas.height = FACE;
  const face2d = faceCanvas.getContext('2d');
  const faceTex = new THREE.CanvasTexture(faceCanvas);
  faceTex.minFilter = THREE.LinearFilter;
  function drawFace(text, prog) {
    face2d.clearRect(0, 0, FACE, FACE);
    const chars = Array.from((text || '').replace(/\s+/g, ''));
    if (!chars.length) return;
    const rows = chars.length <= 5 ? 1 : chars.length <= 12 ? 2 : 3;
    const perRow = Math.ceil(chars.length / rows);
    // Smaller type set close together: characters sit near each other in the middle of the face
    const fontPx = Math.floor(Math.min((FACE - 70) / perRow, (FACE - 90) / rows / 1.15) * 0.6);
    const cell = fontPx * 1.04;                         // advance per character
    const lineH = fontPx * 1.32;                        // advance per row
    face2d.font = '300 ' + fontPx + 'px ' + LYR_FONT;
    face2d.textAlign = 'center';
    face2d.textBaseline = 'middle';
    face2d.shadowColor = 'rgba(255,255,255,0.6)';
    face2d.shadowBlur = 14;
    const lit = prog * chars.length;                   // characters sung so far (fractional)
    const top = FACE / 2 - (rows - 1) * lineH / 2;
    chars.forEach((ch, k) => {
      const r = Math.floor(k / perRow), c = k % perRow;
      const inRow = Math.min(perRow, chars.length - r * perRow);
      const x = FACE / 2 + (c - (inRow - 1) / 2) * cell;
      const y = top + r * lineH;
      const on = Math.max(0, Math.min(1, lit - k));

  }

  // (top = lyrics, left = cover, right = title and singer)
  const CORNER_AZ = Math.atan2(0.9, 3.0);              // same bearing as the ordinary close-up
  const CORNER_EL = Math.asin(1 / Math.sqrt(3));       // 35.3°: the isometric angle, all three faces equal
  const CORNER_D = 3.0;

  const faceHolder = new THREE.Object3D();          // follows the held cube exactly
  function facePlane(tex) {
    const mm = new THREE.Mesh(new THREE.PlaneGeometry(0.78, 0.78),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 }));
    mm.renderOrder = 5;
    mm.visible = false;

  }
  function squareCanvas() {
    const cv = document.createElement('canvas');
    cv.width = cv.height = FACE;
    const tex = new THREE.CanvasTexture(cv);
    tex.minFilter = THREE.LinearFilter;
    return { g: cv.getContext('2d'), tex };
  }
  const coverC = squareCanvas(), infoC = squareCanvas();
  const cubeLyric = facePlane(faceTex);       // top face
  const coverFace = facePlane(coverC.tex);    // left face
  const infoFace = facePlane(infoC.tex);      // right face
