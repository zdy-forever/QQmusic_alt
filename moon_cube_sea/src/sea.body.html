  const infoSides = [0, 1, 2, 3].map(() => facePlane(infoC.tex));
  const camLocal = new THREE.Vector3(), qInv = new THREE.Quaternion();
  scene.add(faceHolder);
  let facesFor = null;                         // the session whose cover and credits are drawn

  const css = (c, k = 1, a = 1) =>
    'rgba(' + [c.r, c.g, c.b].map((v) => Math.min(255, Math.round(v * k * 255))).join(',') + ',' + a + ')';

  // Cover art for a generated song: its night palette, its moon, and its melody as a row of stacked cubes
  function drawCover(s) {
    const { g, tex } = coverC, W = FACE;
    if (s.isTrack) {
      g.clearRect(0, 0, W, W);
      let drawn = false;
      if (s.coverImg) {
        g.drawImage(s.coverImg, 0, 0, W, W);

        // texture, so fall back to the placeholder instead of stalling the scene

      }

        bg.addColorStop(0, css(pal.horizon, 2.4)); bg.addColorStop(1, css(pal.zenith, 2));
        g.fillStyle = bg; g.fillRect(0, 0, W, W);
        g.fillStyle = css(pal.light, 1, 0.85);

        g.textAlign = 'center'; g.textBaseline = 'middle';

      g.lineWidth = 3;
      g.strokeRect(16, 16, W - 32, W - 32);

    }

    g.clearRect(0, 0, W, W);
    const bg = g.createLinearGradient(0, 0, 0, W);
    bg.addColorStop(0, css(pal.zenith, 2.4));
    bg.addColorStop(0.62, css(pal.horizon, 1.7));
    bg.addColorStop(1, css(pal.sea, 0.7));
    g.fillStyle = bg;
    g.fillRect(0, 0, W, W);
    const mx = W * 0.68, my = W * 0.28, mr = W * 0.12;
    const halo = g.createRadialGradient(mx, my, mr * 0.8, mx, my, mr * 3.2);
    halo.addColorStop(0, css(pal.light, 1, 0.45));
    halo.addColorStop(1, css(pal.light, 1, 0));

    g.lineWidth = 3;
    g.strokeRect(16, 16, W - 32, W - 32);
    tex.needsUpdate = true;
  }

  // Credits: song title, singer, key and tempo
  function drawInfo(s, idx) {
    const { g, tex } = infoC, W = FACE;
    g.clearRect(0, 0, W, W);
    if (s.isTrack) {
      const fit = (text, start, min, maxW, weight) => {
        let size = start;
        g.font = weight + ' ' + size + 'px ' + LYR_FONT;
        while (size > min && g.measureText(text).width > maxW) { size -= 2; g.font = weight + ' ' + size + 'px ' + LYR_FONT; }
      };
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.shadowColor = 'rgba(255,255,255,0.55)'; g.shadowBlur = 12;
      fit(s.title, 60, 24, W - 80, '300');
      g.fillStyle = '#ffffff';
      g.fillText(s.title, W / 2, W * 0.38);
      g.shadowBlur = 0;
      g.fillStyle = 'rgba(255,255,255,0.45)';
      g.fillRect(W * 0.32, W * 0.5, W * 0.36, 2);
      g.shadowBlur = 10;
      if (s.artist) { fit('演唱 · ' + s.artist, 34, 18, W - 80, '300'); g.fillStyle = 'rgba(255,255,255,0.92)'; g.fillText('演唱 · ' + s.artist, W / 2, W * 0.61); }
      if (s.album) { fit(s.album, 24, 14, W - 90, '300'); g.fillStyle = 'rgba(255,255,255,0.6)'; g.fillText(s.album, W / 2, W * 0.72); }
      if (s.failText) { g.font = '300 22px ' + LYR_FONT; g.fillStyle = 'rgba(255,190,190,0.95)'; g.fillText(s.failText, W / 2, W * 0.84); }

        s.swatches.forEach((c, i) => {

    }

    g.textBaseline = 'middle';
    g.shadowColor = 'rgba(255,255,255,0.55)';

    g.font = '300 ' + size + 'px ' + LYR_FONT;
    while (size > 28 && g.measureText(s.title).width > W - 90) { size -= 2; g.font = '300 ' + size + 'px ' + LYR_FONT; }
    g.fillStyle = '#ffffff';
    g.fillText(s.title, W / 2, W * 0.4);
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(255,255,255,0.45)';
    g.fillRect(W * 0.32, W * 0.52, W * 0.36, 2);
    g.shadowBlur = 10;
    g.font = '300 34px ' + LYR_FONT;
    g.fillStyle = 'rgba(255,255,255,0.92)';
    g.fillText('演唱 · 方块 №' + (idx + 1).toLocaleString('zh-CN'), W / 2, W * 0.62);
    g.font = '24px "IBM Plex Mono", ui-monospace, monospace';
    g.fillStyle = 'rgba(255,255,255,0.62)';
    g.fillText(NOTE_NAMES[s.root % 12] + ' ' + s.mode.name + ' · ' + s.bpm + ' BPM', W / 2, W * 0.73);
    tex.needsUpdate = true;
  }

  // Steering for the held cube (mirrors the shader's spin, tilt and bob)
  let holdCell = -1, holdW = 0, holdSet = false, holdYaw = 0, holdK = 0;
  const HOLD_TILT = 0;                                 // top face level, so the lyrics lie flat
  const fr = (v) => v - Math.floor(v);

  const UP = new THREE.Vector3(0, 1, 0), AX_X = new THREE.Vector3(1, 0, 0);

  const SKY_LYR_ELEV = 5.2 * Math.PI / 180;            // under the moon (12.4°) and its progress line, above the horizon
  const skyLyrDir = new THREE.Vector3(0, Math.sin(SKY_LYR_ELEV), -Math.cos(SKY_LYR_ELEV));
  const toCam = new THREE.Vector3(), lyrTint = new THREE.Color();
  const smooth5 = (p) => p * p * p * (p * (p * 6 - 15) + 10);

  function updateLyrics(dt, tt) {
    const S = session;
    let text = '', prog = 0, alpha = 0;
    if (S && S.kind === 'track') {
      if (S.lrc && actx) {
        const tn = S.elapsed(), L = S.lrc;
        const clamp01 = (v) => Math.max(0, Math.min(1, v));
        if (tn < L[0].t) {

        } else {

      const rel = actx.currentTime - S.startAt;
      const D = S.stepDur * 16;                          // one line per two-bar phrase
      const env = (x) => Math.max(0, Math.min(1, x / 0.35, (D - x) / 0.35));
      if (rel >= 0 && rel < D) { text = S.s.title; prog = 1; alpha = env(rel); }     // the intro shows the title
      else if (rel >= D) {

    const lyricMode = !!(S && S.s.lyrics);
    const want = !!(S && actx && locked >= 0 && focusCell === locked && actx.currentTime >= S.startAt - 0.5);
    if (holdCell !== focusCell) {

    } else if (want) {

      if (!holdSet && holdCell >= 0) { holdYaw = d; holdSet = true; }
      let target = d;                                     // no lyrics: follow the slow free spin
      if (lyricMode) {
        const base = CORNER_AZ - Math.PI / 4;              // spin that points a vertical edge at the camera
        holdK = Math.round((holdYaw - base) / (Math.PI / 2));   // the corner already nearest, so the turn is short
        target = base + holdK * Math.PI / 2;

    }

    U.uHoldTilt.value = HOLD_TILT;
    U.uHoldW.value = w;

    const closeK = smooth5(focusP) * (1 - smooth5(seaP));
    const farK = locked >= 0 ? smooth5(seaP) : 0;

    // Words printed on that face: rebuild the cube's exact pose (wave, lift, bob, tilt, spin) each frame
    const panelK = holdCell >= 0 && holdCell === focusCell ? closeK * w : 0;
    cubeLyric.material.opacity = lyricMode ? alpha * panelK : 0;   // lyric lines fade in and out
    coverFace.material.opacity = panelK;                            // the cover stays

    coverFace.visible = panelK > 0.005;

    if (panelK <= 0.005 || lyricMode) infoSides.forEach((m) => { m.visible = false; });
    if (panelK > 0.005) {
      const idx = holdCell, L = lift[idx], x = cellX(idx), z = cellZ(idx);

      const sa = yawDefault(idx, L, tt) * (1 - w) + holdYaw * w;

      qS.setFromAxisAngle(UP, sa);
      faceHolder.position.set(x, y, z);
      faceHolder.quaternion.copy(qR).multiply(qT).multiply(qS);

        infoFace.rotation.set(0, aR, 0);

  // Small things that drift by while you watch from afar: paper boats, a school of leaping fish,

  const propMats = {

    fish: new THREE.MeshStandardMaterial({ color: 0xb6c4da, roughness: 0.28, metalness: 0.65 }),

  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  function box(mat, sx, sy, sz, x = 0, y = 0, z = 0) {

    [[-0.5, 0, 0], [0.5, 0, 0], [0.05, 0.85, 0.14]],

  function makeFish() {

  function makeWhale() {
    const g = new THREE.Group();
    const tail = new THREE.Group();
    tail.add(box(propMats.whale, 0.55, 2.3, 0.45, 0, 1.15, 0));
    const lf = box(propMats.whale, 1.6, 0.22, 0.7, -0.75, 2.35, 0); lf.rotation.z = 0.32;
    const rf = box(propMats.whale, 1.6, 0.22, 0.7, 0.75, 2.35, 0); rf.rotation.z = -0.32;
    tail.add(lf, rf);
    tail.scale.setScalar(1.4);

      kind: 'whale', group: g, life: 7.6, drops: [],
      update(p, dt, tt) {

  function makeLanterns() {

  const KINDS = [['boat', 3], ['fish', 3], ['whale', 1.3], ['lantern', 2]];

  function spawnProp() {

    let r = Math.random() * pool.reduce((a, [, w]) => a + w, 0), kind = pool[0][0];
    for (const [k, w] of pool) { if ((r -= w) <= 0) { kind = k; break; } }
    const p = MAKERS[kind]();
    p.age = 0;
    scene.add(p.group);
    props.push(p);
  }

  function updateProps(dt, tt) {
    const want = moonActive();

    } else {
      propTimer = 1.2;

    }

  meta.innerHTML =
    COUNT.toLocaleString('zh-CN') + ' 枚立方体 · 月高 ' + MOON_ELEV.toFixed(1) + '° · ' + WAVES.length + ' 组涌浪' +
    '<br><span class="hint">每枚方块都有一首自己的曲子 · 指向让它浮起，左键锁定聆听</span><span class="hint-touch">每枚方块都有一首自己的曲子 · 轻点浮起，再点一次锁定聆听</span>';

  // ================= Easter egg: the cat =================
  // Three quick taps on the moon (main view) gather every cube into a sitting voxel cat on the water.
  // One more tap on the moon, a click anywhere, or Esc sends them home. The cat is described as a union of
  // simple shapes, sampled on the sea's own 1-unit grid; its surface cells are the visible cubes (several sea
  // cubes may stack into one cell), and each cube sets off by the height of its cell, so the cat builds bottom-up.
  let catTarget = 0, catBuilt = false, moonTaps = [];
  const CAT_AT = new THREE.Vector3(0, 0, -40);    // where it sits: centre of its base on the water
  const CAT_SCALE = 1.25;                          // design units → sea grid units (about 34 units tall)

  function catShape(x, y, z) {
    // returns a colour key if (x, y, z) in design units is inside the cat, else ''
    const ell = (px, py, pz, cx, cy, cz, rx, ry, rz) => ((px - cx) / rx) ** 2 + ((py - cy) / ry) ** 2 + ((pz - cz) / rz) ** 2 <= 1;
    const cap = (px, py, pz, a, b, r) => {             // capsule a→b with radius r
      const abx = b[0] - a[0], aby = b[1] - a[1], abz = b[2] - a[2];
      const t = Math.max(0, Math.min(1, ((px - a[0]) * abx + (py - a[1]) * aby + (pz - a[2]) * abz) / (abx * abx + aby * aby + abz * abz)));
      const dx = px - (a[0] + abx * t), dy = py - (a[1] + aby * t), dz = pz - (a[2] + abz * t);
      return dx * dx + dy * dy + dz * dz <= r * r;
    };
    const ax = Math.abs(x);
    // eyes, nose, muzzle first so they win over the head
    const eyeD = Math.hypot(ax - 2.4, y - 20.4, z - 7.4);
    const head = ell(x, y, z, 0, 19.5, 2.5, 6.6, 5.8, 6.0);
    if (head && eyeD < 1.35) return 'eye';
    if (head && Math.hypot(x, y - 18.9, z - 8.4) < 0.95) return 'nose';
    if (ell(x, y, z, 0, 17.8, 7.4, 2.7, 1.8, 1.6)) return 'cream';
    if (head) return (z > 3 && y < 18.4 && ax < 3.6) ? 'cream' : ((Math.sin(y * 1.5) > 0.55 && z < 4) ? 'stripe' : 'ginger');
    // ears: cones from a base on the head up to a point
    for (const sx of [-1, 1]) {
      const by = 22.6, ty = 28.6, t = (y - by) / (ty - by);
      if (t >= 0 && t <= 1) {
        const r = 3.0 * (1 - t), cx = sx * (3.5 + 0.9 * t);
        if (((x - cx) / r) ** 2 + ((z - 2.2) / Math.max(0.6, r * 0.55)) ** 2 <= 1) return (z > 2.4 && r > 1.0 && ((x - cx) / (r - 0.6)) ** 2 < 1) ? 'pink' : 'ginger';
      }
    }
    // front legs and paws
    for (const sx of [-1, 1]) {
      if (cap(x, y, z, [sx * 2.6, 0.9, 4.4], [sx * 2.4, 8.5, 4.0], 1.7)) return y < 2.2 ? 'cream' : 'ginger';
    }
    // tail curling round the front on the right
    const tp = [[4.5, 1.0, -5.5], [8.6, 1.2, -3.0], [10.0, 1.4, 1.0], [9.0, 1.8, 4.8], [6.6, 2.0, 6.6]];
    for (let i = 0; i + 1 < tp.length; i++) if (cap(x, y, z, tp[i], tp[i + 1], 1.5)) return i === tp.length - 2 ? 'stripe' : ((i % 2) ? 'stripe' : 'ginger');
    // body: a sitting pear, wider at the bottom, cream chest
    const rx = 7.2 + Math.max(0, 9 - y) * 0.22;
    if (ell(x, y, z, 0, 8.6, 0, rx, 8.8, 6.4)) {
      if (z > 3.2 && ax < 3.8 && y > 4 && y < 15.5) return 'cream';
      return (Math.sin(y * 1.3 + ax * 0.25) > 0.6 && z < 2.5) ? 'stripe' : 'ginger';
    }

  }
  const CAT_COL = {
    ginger: new THREE.Color(0xd99a5b), stripe: new THREE.Color(0xa8662f), cream: new THREE.Color(0xf2dfc3),
    pink: new THREE.Color(0xe8a3ad), nose: new THREE.Color(0xe07a8a), eye: new THREE.Color(0x1e3324)
  };

  function buildCat() {
    if (catBuilt) return;
    catBuilt = true;
    const S = CAT_SCALE, cells = new Map(), key = (i, j, k) => i + ',' + j + ',' + k;
    const I = Math.ceil(13 * S), J = Math.ceil(29.5 * S), K0 = Math.floor(-8 * S), K1 = Math.ceil(10.5 * S);
    for (let j = 0; j <= J; j++) for (let i = -I; i <= I; i++) for (let k = K0; k <= K1; k++) {
      const c = catShape(i / S, j / S, k / S);
      if (c) cells.set(key(i, j, k), c);
    }
    // keep only the cells you can see: the ones with an empty neighbour
    const surface = [];
    cells.forEach((c, kk) => {
      const [i, j, k] = kk.split(',').map(Number);
      if (!cells.has(key(i + 1, j, k)) || !cells.has(key(i - 1, j, k)) || !cells.has(key(i, j + 1, k)) ||
          !cells.has(key(i, j - 1, k)) || !cells.has(key(i, j, k + 1)) || !cells.has(key(i, j, k - 1))) {
        surface.push({ x: CAT_AT.x + i, y: CAT_AT.y + j - 0.1, z: CAT_AT.z + k, c, h: j / J });
      }
    });
    // Send cubes from each side of the sea to the same side of the cat: sort both by bearing around the cat
    const bearing = (x, z) => Math.atan2(x - CAT_AT.x, z - CAT_AT.z);
    surface.sort((a, b) => bearing(a.x, a.z) - bearing(b.x, b.z));
    const order = Array.from({ length: COUNT }, (_, k) => k).sort((a, b) => bearing(cellX(a), cellZ(a)) - bearing(cellX(b), cellZ(b)));
    const A = catAttr.array, C = catColAttr.array, n = surface.length;
    order.forEach((idx, r) => {
      const v = surface[Math.min(n - 1, Math.floor(r * n / COUNT))];
      A[idx * 4] = v.x; A[idx * 4 + 1] = v.y; A[idx * 4 + 2] = v.z;
      A[idx * 4 + 3] = Math.min(1, v.h * 0.88 + Math.random() * 0.12);   // bottom first, a little scatter

  moreDot.addEventListener('click', () => setMoreOpen(!moreOpen));
  // choosing an item, tapping elsewhere, or Esc folds the line back up
  moreMenu.addEventListener('click', (ev) => { if (ev.target.closest('button')) setMoreOpen(false, true); });
  addEventListener('pointerdown', (ev) => { if (moreOpen && !moreEl.contains(ev.target)) setMoreOpen(false, true); }, true);
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && moreOpen) { ev.stopImmediatePropagation(); setMoreOpen(false); }
  }, true);

  // ---- Controls follow the moonlight, and step back while you are only watching ----
  let chromeT = 0, idleFor = 0, moonRgbShown = '';
  const markActive = () => { idleFor = 0; if (document.body.classList.contains('idle')) document.body.classList.remove('idle'); };
  ['pointermove', 'pointerdown', 'keydown', 'wheel'].forEach((ev) => addEventListener(ev, markActive, { passive: true }));
  function updateChrome(dt) {
    chromeT -= dt;
    if (chromeT <= 0) {
      chromeT = 0.25;
      // the light colour, lifted toward white so the words stay readable on any song's night
      const c = U.uLightCol.value;
      const ch = (v) => Math.round(Math.min(1, v * 0.55 + 0.45) * 255);
      const v = ch(c.r) + ', ' + ch(c.g) + ', ' + ch(c.b);
      if (v !== moonRgbShown) { moonRgbShown = v; document.documentElement.style.setProperty('--moon-rgb', v); }
    }
    idleFor += dt;
    const panelOpen = !document.getElementById('importPanel').hidden || moreOpen;
    if (idleFor > 3.5 && !panelOpen && !document.body.classList.contains('idle')) document.body.classList.add('idle');
  }

  // ---- Local music import (works offline, no backend) ----
  // Pick files or a folder, or drop them on the page. Title / artist / album / cover / lyrics are read
  // from the files themselves (ID3 in mp3, Vorbis comments in flac); a same-named .lrc file supplies
  // timed lyrics, and cover.jpg / folder.jpg in the same folder supplies a cover. Imported songs are kept
  // in this browser (IndexedDB) so they are still on the sea next time.
  const importStatus = document.getElementById('importStatus');
  const importBody = document.getElementById('importBody');
  const AUDIO_EXT = /\.(mp3|flac|m4a|aac|ogg|oga|opus|wav|webm)$/i;
  const LRC_EXT = /\.lrc$/i;
  const IMG_EXT = /\.(jpe?g|png|webp|gif|bmp)$/i;
  const COVER_NAME = /^(cover|folder|front|album|albumart)[^/]*\.(jpe?g|png|webp)$/i;
  const pathOf = (f) => f.relPath || f.webkitRelativePath || f.name;
  const baseOf = (path) => path.replace(/\.[^./]+$/, '').toLowerCase();
  const dirOf = (path) => { const i = path.lastIndexOf('/'); return i < 0 ? '' : path.slice(0, i); };
  let remember = true, busy = false;
  try { remember = localStorage.getItem('moonCubeSea.remember') !== '0'; } catch (err) { /* default on */ }

  function h(tag, props, ...kids) {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    kids.flat().forEach((k) => n.append(k));
    return n;
  }
  const setImportStatus = (text) => { importStatus.textContent = text; };

  // ---------- text decoding (Chinese tags are often GBK even when marked Latin-1) ----------
  const tryDecode = (label, bytes, fatal) => { try { return new TextDecoder(label, { fatal }).decode(bytes); } catch (err) { return null; } };
  function decodeLoose(bytes) {
    if (bytes.every((b) => b < 0x80)) return tryDecode('latin1', bytes, false);
    return tryDecode('utf-8', bytes, true) ?? tryDecode('gbk', bytes, true) ?? tryDecode('latin1', bytes, false);
  }
  function decodeText(bytes) {
    if (bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) return tryDecode('utf-8', bytes.subarray(3), false);
    if (bytes[0] === 0xff && bytes[1] === 0xfe) return tryDecode('utf-16le', bytes.subarray(2), false);
    if (bytes[0] === 0xfe && bytes[1] === 0xff) return tryDecode('utf-16be', bytes.subarray(2), false);
    return decodeLoose(bytes);
  }

  // ---------- LRC ----------
  function parseLRC(text) {
    const out = [];
    let offset = 0;
    const off = /\[offset:\s*([+-]?\d+)\]/i.exec(text);
    if (off) offset = parseInt(off[1], 10) / 1000;
    text.split(/\r?\n/).forEach((line) => {
      const stamps = [];
      const re = /\[(\d{1,3}):(\d{1,2}(?:[.:]\d{1,3})?)\]/g;
      let m, last = 0;
      while ((m = re.exec(line))) { stamps.push(parseInt(m[1], 10) * 60 + parseFloat(m[2].replace(':', '.'))); last = re.lastIndex; }
      const words = line.slice(last).replace(/<\d+:\d+(?:\.\d+)?>/g, '').trim();   // drop per-word stamps
      if (stamps.length && words) stamps.forEach((t) => out.push({ t: Math.max(0, t - offset), text: words }));
    });
    return out.sort((a, b) => a.t - b.t);
  }

  // ---------- ID3v2 (mp3) ----------
  const be32 = (b, p) => ((b[p] << 24) | (b[p + 1] << 16) | (b[p + 2] << 8) | b[p + 3]) >>> 0;
  const syncsafe = (b, p) => ((b[p] & 0x7f) << 21) | ((b[p + 1] & 0x7f) << 14) | ((b[p + 2] & 0x7f) << 7) | (b[p + 3] & 0x7f);
  function decodeEnc(bytes, enc) {
    if (enc === 1) {
      if (bytes[0] === 0xfe && bytes[1] === 0xff) return tryDecode('utf-16be', bytes.subarray(2), false);
      if (bytes[0] === 0xff && bytes[1] === 0xfe) return tryDecode('utf-16le', bytes.subarray(2), false);
      return tryDecode('utf-16le', bytes, false);
    }
    if (enc === 2) return tryDecode('utf-16be', bytes, false);
    if (enc === 3) return tryDecode('utf-8', bytes, false);
    return decodeLoose(bytes);
  }
  // End of a null-terminated string in the given encoding (two zero bytes for UTF-16)
  function termEnd(b, from, enc) {
    if (enc === 1 || enc === 2) {
      for (let i = from; i + 1 < b.length; i += 2) if (b[i] === 0 && b[i + 1] === 0) return i;
      return b.length;
    }
    const i = b.indexOf(0, from);
    return i < 0 ? b.length : i;
  }
  const cleanTag = (t) => (t || '').replace(/\0/g, '').trim();
  async function parseID3(file, head) {
    const ver = head[3], flags = head[5];
    const size = syncsafe(head, 6);
    const b = new Uint8Array(await file.slice(10, 10 + Math.min(size, 24 * 1024 * 1024)).arrayBuffer());
    const out = {};
    let p = 0, cover = null;
    if ((flags & 0x40) && ver >= 3) p = ver === 4 ? syncsafe(b, 0) : be32(b, 0) + 4;   // skip extended header
    const idLen = ver === 2 ? 3 : 4, hdr = ver === 2 ? 6 : 10;
    while (p + hdr <= b.length) {
      const id = String.fromCharCode(...b.subarray(p, p + idLen));
      if (!/^[A-Z0-9]+$/.test(id)) break;
      const fsize = ver === 2 ? (b[p + 3] << 16) | (b[p + 4] << 8) | b[p + 5] : ver === 4 ? syncsafe(b, p + 4) : be32(b, p + 4);
      if (fsize <= 0 || p + hdr + fsize > b.length) break;
      const f = b.subarray(p + hdr, p + hdr + fsize);
      p += hdr + fsize;
      const enc = f[0];
      if (id === 'TIT2' || id === 'TT2') out.title = cleanTag(decodeEnc(f.subarray(1), enc));
      else if (id === 'TPE1' || id === 'TP1') out.artist = cleanTag(decodeEnc(f.subarray(1), enc)).replace(/\0/g, ' / ');
      else if (id === 'TALB' || id === 'TAL') out.album = cleanTag(decodeEnc(f.subarray(1), enc));
      else if (id === 'USLT' || id === 'ULT') {
        const e = termEnd(f, 4, enc);
        out.lyrics = decodeEnc(f.subarray(e + (enc === 1 || enc === 2 ? 2 : 1)), enc);
      } else if (id === 'APIC' || id === 'PIC') {
        let mime, q;
        if (id === 'PIC') { const fmt = String.fromCharCode(f[1], f[2], f[3]).toLowerCase(); mime = fmt === 'png' ? 'image/png' : 'image/jpeg'; q = 4; }
        else { const me = f.indexOf(0, 1); mime = String.fromCharCode(...f.subarray(1, me)) || 'image/jpeg'; q = me + 1; }
        const ptype = f[q];
        const de = termEnd(f, q + 1, enc);
        const data = f.subarray(de + (enc === 1 || enc === 2 ? 2 : 1));
        if (data.length > 100 && (!cover || ptype === 3)) cover = new Blob([data], { type: mime.includes('/') ? mime : 'image/' + mime });
      }
    }
    out.cover = cover;
    return out;
  }

  // ---------- FLAC (Vorbis comments + PICTURE) ----------
  async function parseFLAC(file) {
    const out = {};
    let pos = 4;
    for (let guard = 0; guard < 64 && pos + 4 <= file.size; guard++) {
      const hd = new Uint8Array(await file.slice(pos, pos + 4).arrayBuffer());
      const last = hd[0] & 0x80, type = hd[0] & 0x7f, len = (hd[1] << 16) | (hd[2] << 8) | hd[3];
      pos += 4;
      if (type === 4 || type === 6) {
        const b = new Uint8Array(await file.slice(pos, pos + len).arrayBuffer());
        const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
        if (type === 4) {
          let q = 4 + dv.getUint32(0, true);
          const count = dv.getUint32(q, true); q += 4;
          for (let i = 0; i < count && q + 4 <= b.length; i++) {
            const l = dv.getUint32(q, true); q += 4;
            const kv = tryDecode('utf-8', b.subarray(q, q + l), false) || ''; q += l;
            const eq = kv.indexOf('=');
            if (eq < 0) continue;
            const key = kv.slice(0, eq).toUpperCase(), val = kv.slice(eq + 1).trim();
            if (key === 'TITLE' && !out.title) out.title = val;
            else if (key === 'ARTIST') out.artist = out.artist ? out.artist + ' / ' + val : val;
            else if (key === 'ALBUM' && !out.album) out.album = val;
            else if ((key === 'LYRICS' || key === 'UNSYNCEDLYRICS') && !out.lyrics) out.lyrics = val;
          }
        } else {
          const ptype = dv.getUint32(0, false);
          let q = 4;
          const ml = dv.getUint32(q, false); q += 4;
          const mime = String.fromCharCode(...b.subarray(q, q + ml)); q += ml;
          const dl = dv.getUint32(q, false); q += 4 + dl + 16;
          const n = dv.getUint32(q, false); q += 4;
          if (!out.cover || ptype === 3) out.cover = new Blob([b.subarray(q, q + n)], { type: mime || 'image/jpeg' });
        }
      }
      pos += len;
      if (last) break;
    }
    return out;
  }

  async function readTags(file) {
    try {
      const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
      if (head[0] === 0x49 && head[1] === 0x44 && head[2] === 0x33) return await parseID3(file, head);   // "ID3"
      if (head[0] === 0x66 && head[1] === 0x4c && head[2] === 0x61 && head[3] === 0x43) return await parseFLAC(file); // "fLaC"
    } catch (err) { /* unreadable tags: fall back to the file name */ }
    return {};
  }
  // "01. 歌手 - 歌名.mp3" → { artist, title }
  function fromFileName(name) {
    const base = name.replace(/\.[^.]+$/, '').replace(/^\s*\d{1,3}\s*[.\-_ ]\s*/, '').trim();
    const m = /^(.+?)\s+-\s+(.+)$/.exec(base);
    return m ? { artist: m[1].trim(), title: m[2].trim() } : { artist: '', title: base };
  }

  // ---------- library in IndexedDB ----------
  const DB_NAME = 'moonCubeSea', STORE = 'library';
  function openDB() {
    return new Promise((resolve, reject) => {
      const rq = indexedDB.open(DB_NAME, 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore(STORE);
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  }
  const txDone = (tx) => new Promise((resolve, reject) => { tx.oncomplete = resolve; tx.onerror = tx.onabort = () => reject(tx.error); });
  const reqP = (rq) => new Promise((resolve, reject) => { rq.onsuccess = () => resolve(rq.result); rq.onerror = () => reject(rq.error); });
  async function saveLibrary(data) {
    const db = await openDB();
    try {
      let tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).clear();
      await txDone(tx);
      // one song per write keeps each transaction small
      for (let k = 0; k < data.tracks.length; k++) {
        const t = data.tracks[k];
        tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put({ title: t.title, artist: t.artist, album: t.album, lrc: t.lrc, plain: t.plain, duration: t.duration || 0, audio: t.blob, cover: t.coverBlob || null }, 'song:' + k);
        await txDone(tx);
        if (k % 10 === 0) setImportStatus('正在保存到浏览器 ' + (k + 1) + ' / ' + data.tracks.length + ' 首…');
      }
      tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put({ name: data.name, count: data.tracks.length }, 'meta');
      await txDone(tx);
    } finally { db.close(); }
  }
  async function clearLibrary() {
    const db = await openDB();
    try { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).clear(); await txDone(tx); } finally { db.close(); }
  }
  async function loadLibrary() {
    const db = await openDB();
    try {
      const st = db.transaction(STORE, 'readonly').objectStore(STORE);
      const meta = await reqP(st.get('meta'));
      if (!meta || !meta.count) return null;
      const tracks = [];
      for (let k = 0; k < meta.count; k++) {
        const r = await reqP(db.transaction(STORE, 'readonly').objectStore(STORE).get('song:' + k));
        if (r && r.audio) tracks.push({ title: r.title, artist: r.artist, album: r.album, lrc: r.lrc, plain: r.plain, duration: r.duration, blob: r.audio, coverBlob: r.cover });
      }
      return tracks.length ? { name: meta.name, tracks } : null;
    } finally { db.close(); }
  }

  // ---------- putting songs on the sea ----------
  function releaseURLs(data) {
    if (!data) return;
    data.tracks.forEach((t) => { if (t.url) URL.revokeObjectURL(t.url); if (t.coverUrl) URL.revokeObjectURL(t.coverUrl); });
  }
  function showOnSea(data) {
    data.tracks.forEach((t) => {
      t.url = URL.createObjectURL(t.blob);
      t.coverUrl = t.coverBlob ? URL.createObjectURL(t.coverBlob) : '';
    });
    if (locked >= 0 && trackOfCube.has(locked)) unlock();
    releaseURLs(imported);
    placeTracks(data);
  }

  async function importFiles(files, label) {
    if (busy) return;
    const audio = files.filter((f) => f.size > 0 && AUDIO_EXT.test(f.name))
      .sort((a, b) => pathOf(a).localeCompare(pathOf(b), 'zh-CN', { numeric: true }));
    if (!audio.length) { setImportStatus('没有找到音乐文件。支持 mp3、flac、m4a、ogg、wav 等格式。'); return; }
    busy = true;
    renderImport();
    try {
      const lrcByPath = new Map(), lrcByName = new Map(), imgByPath = new Map(), dirCover = new Map();
      files.forEach((f) => {
        const pth = pathOf(f);
        if (LRC_EXT.test(f.name)) { lrcByPath.set(baseOf(pth), f); lrcByName.set(baseOf(f.name), f); }
        else if (IMG_EXT.test(f.name)) {
          imgByPath.set(baseOf(pth), f);
          const d = dirOf(pth);
          if (COVER_NAME.test(f.name) || !dirCover.has(d)) dirCover.set(d, f);
        }
      });
      const tracks = [];
      for (let i = 0; i < audio.length && tracks.length < MAX_TRACKS; i++) {
        const f = audio[i], pth = pathOf(f);
        if (i % 4 === 0) setImportStatus('正在读取 ' + (i + 1) + ' / ' + audio.length + ' 首…');
        const tags = await readTags(f);
        const fb = fromFileName(f.name);
        let lrc = null, plain = null;
        const lf = lrcByPath.get(baseOf(pth)) || lrcByName.get(baseOf(f.name));
        const lyricText = lf ? decodeText(new Uint8Array(await lf.arrayBuffer())) : tags.lyrics;
        if (lyricText) {
          const timed = parseLRC(lyricText);
          if (timed.length) lrc = timed;
          else plain = lyricText.split(/\r?\n/).map((x) => x.trim()).filter(Boolean);
        }
        tracks.push({
          title: tags.title || fb.title, artist: tags.artist || fb.artist, album: tags.album || '',
          blob: f, coverBlob: tags.cover || imgByPath.get(baseOf(pth)) || dirCover.get(dirOf(pth)) || null,
          lrc, plain, duration: 0
        });
      }
      const data = { name: label, tracks };
      showOnSea(data);
      let note = '';
      if (remember) {
        try { await saveLibrary(data); note = '，已保存在这个浏览器里'; }
        catch (err) { note = '。这些歌太大，浏览器没能保存，下次打开需要重新导入'; }
      } else {
        clearLibrary().catch(() => {});
      }
      const withLyrics = tracks.filter((t) => t.lrc || t.plain).length;
      setImportStatus('已导入 ' + tracks.length + ' 首（' + withLyrics + ' 首有歌词），放在镜头前方的海面上' + note);
    } finally {
      busy = false;
      renderImport(true);
    }
  }

  // ---------- panel ----------
  const pickFiles = h('input', { type: 'file', multiple: true, accept: 'audio/*,.mp3,.flac,.m4a,.aac,.ogg,.oga,.opus,.wav,.webm,.lrc,image/*', hidden: true });
  const pickDir = h('input', { type: 'file', multiple: true, hidden: true });
  pickDir.setAttribute('webkitdirectory', '');
  pickFiles.addEventListener('change', () => { const fs = [...pickFiles.files]; pickFiles.value = ''; importFiles(fs, '本地音乐'); });
  pickDir.addEventListener('change', () => {
    const fs = [...pickDir.files]; pickDir.value = '';
    const top = fs.length ? (fs[0].webkitRelativePath || '').split('/')[0] : '';
    importFiles(fs, top || '本地文件夹');
  });
  document.body.append(pickFiles, pickDir);

  function renderImport(keepStatus) {
    importBody.replaceChildren();
    if (!keepStatus) setImportStatus(imported ? '海面上有 ' + cubeOfTrack.length + ' 首你的歌' : '把电脑里的音乐放到海面上');
    const rememberBox = h('input', { type: 'checkbox', id: 'impRemember', checked: remember, disabled: busy,
      onchange: () => { remember = rememberBox.checked; try { localStorage.setItem('moonCubeSea.remember', remember ? '1' : '0'); } catch (err) { /* ignore */ } } });
    importBody.append(
      h('div', { className: 'imp-row' },
        h('button', { className: 'imp-btn', type: 'button', textContent: '选择音乐文件', disabled: busy, onclick: () => pickFiles.click() }),
        h('button', { className: 'imp-btn', type: 'button', textContent: '选择整个文件夹', disabled: busy, onclick: () => pickDir.click() })),
      h('p', {}, '也可以把文件或文件夹直接拖到页面上。'),
      h('p', { className: 'imp-small' }, '歌词：同名的 .lrc 文件，或歌曲里内嵌的歌词。封面：歌曲里内嵌的图片，或同一文件夹里的 cover.jpg、folder.jpg。'),
      h('label', { className: 'imp-check', htmlFor: 'impRemember' }, rememberBox, ' 记住这些歌，下次打开不用重新导入'));
    if (imported) {
      importBody.append(h('div', { className: 'imp-current' },
        h('p', {}, '海面上：' + imported.name + ' · ' + cubeOfTrack.length + ' 首'),
        h('div', { className: 'imp-row' },
          h('button', { className: 'imp-btn', type: 'button', textContent: '清除导入', disabled: busy, onclick: () => {
            if (locked >= 0 && trackOfCube.has(locked)) unlock();
            releaseURLs(imported);
            placeTracks(null);
            clearLibrary().catch(() => {});
            renderImport();
          } }))));
    }
  }

  // ---------- drag and drop anywhere on the page ----------
  const dropHint = h('div', { className: 'drop-hint', hidden: true }, h('p', {}, '松开，把音乐放到海面上'));
  document.body.append(dropHint);
  let dragDepth = 0;
  const hasFiles = (ev) => ev.dataTransfer && [...ev.dataTransfer.types].includes('Files');
  addEventListener('dragenter', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); dragDepth++; dropHint.hidden = false; });
  addEventListener('dragover', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
  addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropHint.hidden = true; });
  addEventListener('drop', async (ev) => {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    dragDepth = 0;
    dropHint.hidden = true;
    const items = [...ev.dataTransfer.items].filter((it) => it.kind === 'file');
    const entries = items.map((it) => (it.webkitGetAsEntry ? it.webkitGetAsEntry() : null)).filter(Boolean);
    let files = [];
    let label = '本地音乐';
    if (entries.length) {
      const walk = async (entry, prefix) => {
        if (entry.isFile) {
          const f = await new Promise((resolve, reject) => entry.file(resolve, reject));
          f.relPath = prefix + f.name;
          files.push(f);
        } else if (entry.isDirectory) {
          const reader = entry.createReader();
          for (;;) {
            const batch = await new Promise((resolve, reject) => reader.readEntries(resolve, reject));
            if (!batch.length) break;
            for (const e of batch) await walk(e, prefix + entry.name + '/');
          }
        }
      };
      for (const e of entries) await walk(e, '');
      const dirs = entries.filter((e) => e.isDirectory);
      if (dirs.length === 1) label = dirs[0].name;
    } else {
      files = [...ev.dataTransfer.files];
    }
    if (importPanel.hidden) setImportOpen(true);
    importFiles(files, label);
  });

  // Bring back the songs saved last time
  if (window.indexedDB) {
    loadLibrary().then(async (data) => {
      if (!data || imported) return;
      showOnSea(data);
      if (!importPanel.hidden) renderImport();
    }).catch(() => {});
  }

  const importBtn = document.getElementById('importBtn');
  const importPanel = document.getElementById('importPanel');
  function setImportOpen(open) {
    importPanel.hidden = !open;
    if (open) renderImport();
    importBtn.setAttribute('aria-expanded', String(open));
    if (open) document.getElementById('importClose').focus();
    else if (importPanel.contains(document.activeElement)) document.getElementById('moreDot').focus();   // 歌单导入 itself sits folded away in the menu
  }
  importBtn.addEventListener('click', () => { if (importPanel.hidden) setMoreOpen(false); setImportOpen(importPanel.hidden); });
  document.getElementById('importClose').addEventListener('click', () => setImportOpen(false));
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !importPanel.hidden) { ev.stopImmediatePropagation(); setImportOpen(false); }
  }, true);
})();
</script>
